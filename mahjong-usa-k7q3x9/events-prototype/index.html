<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mahjong USA: events calendar prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#0d0d0d;--paper:#fff;--gray:#f3f3f1;--line:#d6d6d2;--mute:#666;--warn:#fff4d6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;line-height:1.45}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.sr{position:absolute;left:-9999px}

/* header */
.top{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:2px solid var(--ink)}
.top .wrap{display:flex;align-items:center;gap:24px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em;text-decoration:none}
.mark{width:26px;height:32px;border:2.5px solid var(--ink);border-radius:6px;box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;font-size:15px;font-weight:800}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a,.nav button{padding:8px 12px;border-radius:999px;text-decoration:none;font-weight:600;font-size:15px;background:none;border:0}
.nav a:hover,.nav button:hover{background:var(--gray)}
.nav .cta{border:2px solid var(--ink)}

/* toolbar */
.tb{display:flex;align-items:center;gap:26px;flex-wrap:wrap;padding:16px 0 14px}
.tbtn{background:none;border:0;padding:6px 0;font-weight:600;font-size:15px;color:var(--ink)}
.tbtn small{color:var(--mute);font-weight:500;font-size:14px}
.tb .right{margin-left:auto;display:flex;gap:20px}
.tab{background:none;border:0;padding:6px 0;font-size:15px;font-weight:500;color:var(--mute);border-bottom:2px solid transparent}
.tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.popwrap{position:relative}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:60;min-width:260px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.14)}
.pop h4{margin:6px 8px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.opt{display:flex;align-items:center;width:100%;padding:9px 10px;border:0;background:none;border-radius:8px;text-align:left;font-weight:500;font-size:15px}
.opt:hover{background:var(--gray)}
.opt.sel{font-weight:700}
.opt:not(.chkopt).sel::after{content:'\2713';margin-left:auto;padding-left:12px}
.opt span{color:var(--mute);font-size:13px;margin-left:auto;padding-left:12px}
.opt .bx{width:18px;height:18px;border:1.5px solid var(--ink);border-radius:5px;margin:0 10px 0 0;padding:0;display:grid;place-items:center;font-size:12px;color:#fff;flex:none}
.opt.chkopt.sel .bx{background:var(--ink)}
.plink{padding:2px 10px 6px;font-size:13px}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.placeq{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;margin-bottom:6px}
.popw{min-width:340px}
.hint{padding:10px;font-size:14px;color:var(--mute);line-height:1.4}
.hint b{color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;font-weight:600;font-size:inherit}

/* layout: left column (list or details), right stage (calendar or map) */
.top{flex:none}
.tb{position:relative;z-index:50;padding:10px 20px;border-bottom:1px solid var(--line);gap:22px;background:#fff}
.chkopt{gap:10px;justify-content:flex-start}
.chkopt .bx{flex:none;width:18px;height:18px;border:2px solid var(--ink);border-radius:5px;display:grid;place-items:center;font-style:normal;font-size:12px;line-height:1;color:#fff}
.chkopt.on .bx{background:var(--ink)}
.chkopt.on .bx::after{content:'\2713'}
.pop .selall{font-weight:600;font-size:14px;text-decoration:underline}
.fbstrip{padding:10px 20px 0}
.split{display:grid;grid-template-columns:minmax(340px,420px) minmax(0,1fr)}
.panel{overflow-y:auto;border-right:1px solid var(--line);background:#fff;min-height:0}
.plist{padding:14px 18px 40px}
.stage{min-width:0;min-height:0;padding:14px 20px 20px;display:flex;flex-direction:column;overflow:auto;position:relative;z-index:0}
.calwrap{flex:1;min-height:0;display:flex;flex-direction:column}

/* next up: the one heavy thing */
.nextup{background:var(--ink);color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:6px}
.nextup .nl{margin:0;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#bdbdb8}
.nextup h2{margin:6px 0 4px;font-size:22px;line-height:1.15;letter-spacing:-.02em;font-weight:800}
.nextup .nm{margin:0;font-size:14px;color:#d6d6d1}
.na{display:flex;gap:14px;align-items:center;margin-top:12px;flex-wrap:wrap}
.nbtn{display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:999px;background:#fff;color:var(--ink);font-weight:700;font-size:14px;text-decoration:none}
.nlink{color:#fff;font-size:13px;font-weight:600}

/* list */
.lh{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 2px}
.lh h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:700}
.dg{margin:18px 0 2px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.lr{display:block;position:relative;padding:11px 28px 11px 10px;margin:0 -10px;text-decoration:none;border-bottom:1px solid #ecece8;border-radius:10px}
.lr:hover{background:var(--gray)}
.lr.cur{background:var(--gray);box-shadow:inset 3px 0 0 var(--ink)}
.lr b{font-size:16px;font-weight:700}
.lr .rm{font-size:13px;color:var(--mute);margin-top:1px}
.ck{position:absolute;right:10px;top:12px;font-weight:800;font-size:15px}
.seen .tt{color:#6a4fb3}
.nearest{background:var(--gray);border-radius:14px;padding:14px 16px;margin:6px 0 10px;font-size:15px}
.nearest b{display:block;font-size:16px;margin-bottom:2px}
.more2{margin-top:12px;font-size:14px}

/* calendar: quiet, full width. Dots and a count; details live in the left column */
.calhead{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex:none}
.calhead h3{margin:0 8px 0 0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.calhead button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:16px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.dow{padding:8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 8px;display:flex;flex-direction:column;gap:6px;background:#fff;cursor:pointer;min-width:0}
.day:hover{background:#fafaf8}
.day.out{background:#fafaf8}
.day.out .dn,.day.past .dn{color:#c4c4c0}
.day.sel{background:#f0f0ec;box-shadow:inset 0 0 0 2px var(--ink)}
.dn{font-size:13px;font-weight:600;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.day.today .dn{background:var(--ink);color:#fff}
.pips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.pip{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--ink);text-decoration:none;color:var(--ink)}
.pip:hover{transform:scale(1.25)}
.pip.nx{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.pip.cu{box-shadow:0 0 0 2px #fff,0 0 0 4px #6a4fb3}
.pip.ad{background:none;width:auto;height:auto;font-size:14px;font-weight:800;line-height:1}
.cnt{font-size:12px;color:var(--mute)}
#map{flex:1;min-height:420px;border:1px solid var(--line);border-radius:16px;background:var(--gray)}
.leaflet-tile{filter:grayscale(1) contrast(1.05)}

.hint{padding:10px;font-size:14px;color:var(--mute);line-height:1.4}
.hint b{color:var(--ink)}
.placeq{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;margin-bottom:6px}
.popw{min-width:340px}
/* event overlay */
.ovp{position:relative;background:#fff;border-radius:20px;width:100%;max-width:760px;max-height:92vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.ovxw{position:sticky;top:0;height:0;z-index:5;display:flex;justify-content:flex-end}
.ovx{margin:12px 12px 0 0;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px;line-height:1}
.ovb{padding:26px 28px 12px}
.ovbar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:12px;align-items:center}
.ovbar .when{font-weight:800;font-size:16px;line-height:1.2}
.ovbar .when small{display:block;font-weight:500;font-size:13px;color:var(--mute)}
.ovbar .acts{margin-left:auto;display:flex;gap:8px}
.ehead{display:flex;gap:18px;align-items:center;margin:0 44px 18px 0}
.ehead h1{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.03em;font-weight:800}
.sec{margin:0 0 26px}
.sec h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px;color:var(--mute)}
.sec p{margin:0;font-size:16px}
.box{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;margin-bottom:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--ink);background:#fff;font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--ink);color:#fff}
.btn.full{width:100%}
.btn[disabled]{border-style:dashed;color:#999;border-color:#bbb;cursor:not-allowed}
.btn em{font-style:normal;font-size:11px;background:var(--gray);border-radius:6px;padding:1px 6px;color:var(--mute)}
.row2{display:flex;gap:8px;margin-top:10px}.row2>*{flex:1}
#emap{height:180px;border-radius:12px;border:1px solid var(--line);margin:12px 0}
.banner{border:1.5px solid var(--ink);background:var(--warn);border-radius:14px;padding:14px 16px;margin:0 0 18px;font-size:15px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.banner b{display:block}
.banner button{margin-left:auto;background:none;border:0;text-decoration:underline;font-weight:600}
.org{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:14px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
details{border-bottom:1px solid var(--line);padding:10px 0}
summary{font-weight:600;cursor:pointer;font-size:15px}
details p{margin-top:6px;color:var(--mute);font-size:14px}
.mini{display:grid;grid-template-columns:1fr;gap:6px}
.mini .card{border:1px solid var(--line);padding:10px}
.codebox{display:inline-block;border:2px dashed var(--ink);border-radius:8px;padding:4px 10px;font-weight:800;letter-spacing:.06em;margin-right:8px}
.calmenu{position:absolute;bottom:calc(100% + 8px);right:0;min-width:230px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.calmenu a,.calmenu button{display:block;width:100%;padding:10px 12px;text-align:left;border:0;background:none;border-radius:8px;font-weight:600;font-size:15px;text-decoration:none}
.calmenu a:hover,.calmenu button:hover{background:var(--gray)}
.hostlist{border-top:1px solid var(--line)}.hrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.hl{flex:1;min-width:0;text-decoration:none;display:flex;flex-direction:column}.hl b{font-size:15px}
.day{cursor:default}.day.has{cursor:pointer}.day:not(.has):hover{background:#fff}
.mapnote{font-size:14px;color:var(--mute);margin:0 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.chip:hover{background:var(--gray)}
.chip.on{border-color:var(--ink);background:var(--gray);box-shadow:inset 0 0 0 1px var(--ink)}
.rst{font-size:14px;margin-left:4px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:#555;margin:0 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .pip{position:static;display:inline-grid;pointer-events:none}
.legend .vis{color:#4b2f99}
.opt .ot{display:flex;flex-direction:column;align-items:flex-start;margin:0!important;padding:0!important}
.opt .ot small{font-size:12px;color:#595959;font-weight:400;margin-top:1px}
.calhead button:disabled{opacity:.35;cursor:default}
.seen .tt,.card h3.seen{color:#4b2f99}
.cnt{font-size:13px;color:#555}
:focus-visible{outline:3px solid #4b2f99;outline-offset:2px}
.day:focus-visible{outline-offset:-3px}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.iconbtn:hover{background:var(--gray)}
.dirlink{display:inline-block;margin-top:10px;font-weight:600;font-size:15px;text-decoration:underline}
.dbar>.btn.ghost{border-color:transparent;background:none;flex:0 0 auto;width:auto;text-decoration:underline}
.foot{border-top:1px solid var(--line);padding:28px 0 60px;color:var(--mute);font-size:14px}

/* cards (inside overlay lists) */
.card{display:flex;gap:14px;align-items:center;padding:10px;text-decoration:none;border-radius:12px}
.card:hover{background:var(--gray)}
.tile{flex:none;width:54px;height:66px;border:2.5px solid var(--ink);border-radius:10px;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;line-height:1}
.tile .m{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tile .d{font-size:26px;font-weight:800;margin-top:4px}
.card h3{margin:0;font-size:16px;font-weight:700;line-height:1.25}
.meta{margin-top:3px;font-size:14px;color:var(--mute)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:12px;font-weight:700;border:1.5px solid var(--ink);border-radius:6px;padding:1px 7px;background:#fff}
.tag.solid{background:var(--ink);color:#fff}
.tag.soft{border-color:var(--line);color:var(--mute);font-weight:600}
.tag.warn{background:var(--warn)}
.card .go{margin-left:auto;font-size:22px;font-weight:700}
.card h3.seen{color:#6a4fb3}


/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(13,13,13,.5);z-index:2000;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:22px;width:100%;max-width:440px;box-shadow:8px 8px 0 var(--ink)}
.modal h3{margin:0 0 6px;font-size:22px}
.modal p{margin:0 0 12px;color:var(--mute)}
.radio{display:flex;gap:10px;align-items:center;padding:10px 4px;font-weight:500;font-size:16px}
.radio input{width:20px;height:20px;accent-color:#000}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:3000;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

/* details panel (same content on desktop column and phone overlay) */
.dhead{position:sticky;top:0;z-index:5;background:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.dhead .sp{flex:1}
.dback{background:none;border:0;font-weight:700;font-size:15px;padding:8px 10px;border-radius:999px}
.dback:hover{background:var(--gray)}
.btn.sm{height:36px;padding:0 14px;font-size:14px}
.dbody{padding:14px 18px 28px}
.dtitle{margin:14px 0 4px;font-size:28px;line-height:1.08;letter-spacing:-.03em;font-weight:800}
.dbody .sec{margin:0 0 24px}
.dbody .sec p{font-size:15px}
.kv{display:grid;grid-template-columns:80px 1fr;gap:8px 12px;font-size:15px;margin:0 0 14px}
.kv dt{font-weight:700}.kv dd{margin:0}
.dbody .mini{grid-template-columns:1fr}
.dbody #emap{height:170px}
.dbar{position:sticky;bottom:0;z-index:5;background:#fff;border-top:2px solid var(--ink);padding:12px 16px;display:flex;gap:8px}
.dbar .popwrap{flex:1}
.dbar .btn{width:100%}
.dbar>.btn{flex:1}
.dbar .calmenu{left:0;right:0}
.dbar .added{font-size:13px;color:var(--mute)}
/* vertical rhythm: one 4px-based scale (4 8 12 16 24 32) so spacing can be retuned in one place when branding lands */
:root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px}
.plist{padding:var(--s5) 20px 48px}
.chips{gap:var(--s2);margin:0 0 var(--s5)}
.chip{padding:6px 12px;font-size:13.5px;line-height:1.2}
.lh{margin:0 0 var(--s1)}
.dg{margin:var(--s5) 0 var(--s1);line-height:1.2}
.lh + .dg{margin-top:var(--s3)}
.lr{padding:var(--s3) 32px var(--s3) var(--s3);margin:0 calc(var(--s3) * -1);line-height:1.35}
.lr b{display:block;font-size:16px;line-height:1.3}
.lr .rm{margin-top:var(--s1);line-height:1.35}
.ck{top:var(--s3);right:var(--s3)}
.nearest{margin:0 0 var(--s4);padding:var(--s4)}
.dbody{padding:var(--s5) 20px var(--s6)}
.dbody .tags{margin:0 0 var(--s3)!important}
.dtitle{margin:0 0 var(--s5);line-height:1.12}
.kv{gap:var(--s3) var(--s4);margin:0 0 var(--s4)}
.dbody #emap{margin:0 0 var(--s3)}
.dirlink{margin:0}
.dbody .sec{margin:0 0 var(--s6)}
.dbody .sec:first-of-type{margin-bottom:var(--s6)}
.sec h2{margin:0 0 var(--s2)}
.dbody .sec p{line-height:1.5}
details{padding:var(--s3) 0}
.dhead{padding:var(--s2) var(--s3)}
.dbar{padding:var(--s3) var(--s4)}
.banner{margin:0 0 var(--s4)}

@media(min-width:901px){
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden}
  #app{flex:1;min-height:0;display:flex;flex-direction:column}
  .split{flex:1;min-height:0}
}
@media(max-width:900px){
  .wrap{padding:0 16px}
  .nav a.hide-m{display:none}
  .tb{padding:10px 16px;gap:18px}
  .tb .right{margin-left:0;width:100%}
  .fbstrip{padding:10px 16px 0}
  .split{display:flex;flex-direction:column}
  .stage{order:1;padding:12px 16px;overflow:visible}
  .panel{order:2;border-right:0;overflow:visible}
  .plist{padding:var(--s4) 16px 40px}
  .panel.detail{position:fixed;inset:0;z-index:1500;overflow-y:auto;border:0}
  body.lock{overflow:hidden}
  .grid{grid-template-rows:none!important;grid-auto-rows:minmax(54px,auto)}
  .day{padding:4px 2px;align-items:center;gap:4px}
  .cnt{display:none}
  .pips{justify-content:center;gap:3px}
  .pip{width:9px;height:9px}
  .dow{padding:6px 2px;text-align:center;font-size:11px}
  .calhead h3{font-size:20px}
  #map{flex:none;height:300px;min-height:0}
  .nextup h2{font-size:20px}
  .dtitle{font-size:26px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#home"><span class="mark">M</span>Mahjong USA</a>
  <nav class="nav">
    <button data-a="submit" class="cta">Submit an event</button>
  </nav>
</div></header>
<main id="app"></main>
<div id="modalroot"></div>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/real-events.js"></script>
<script>/* ---------- helpers ---------- */
const TODAY=new Date(2026,10,17);
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MS=MON.map(m=>m.slice(0,3));
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DS=DOW.map(d=>d.slice(0,3));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

  const byDay={};filtered(true).forEach(e=>{(byDay[e.date]=byDay[e.date]||[]).push(e)});
  let cells=DS.map(d=>`<div class="dow">${d}</div>`).join('');
  const curMonth=(y===TODAY.getFullYear()&&m===TODAY.getMonth());
  const skip=curMonth?Math.floor((first.getDay()+TODAY.getDate()-1)/7):0;
  const shown=rows-skip;
  for(let i=skip*7;i<rows*7;i++){
    const d=addDays(start,i);const ds=iso(d);const evs=byDay[ds]||[];
    let cls='day';if(d.getMonth()!==m)cls+=' out';if(ds<TISO)cls+=' past';if(ds===TISO)cls+=' today';if(S.day===ds)cls+=' sel';
    const pips=evs.slice(0,6).map(e=>`<a class="pip${nx&&nx.uid===e.uid?' nx':''}${cur&&cur.uid===e.uid?' cu':''}${S.added[e.uid]?' ad':''}" href="#event-${e.uid}" title="${esc(e.title)}" tabindex="-1" aria-hidden="true">${S.added[e.uid]?'✓':''}</a>`).join('');
    const cnt=evs.length?`<span class="cnt">${evs.length} ${evs.length===1?'game':'games'}</span>`:'';
    const lab=fmtDay(ds,true)+(evs.length?', '+evs.length+(evs.length===1?' game':' games'):', no games');
    const act=!evs.length?'':(evs.length===1?` data-a="goev" data-v="${evs[0].uid}"`:` data-a="day" data-v="${ds}"`)+` role="button" tabindex="0" aria-label="${esc(lab)}"`;
    if(evs.length)cls+=' has';
    cells+=`<div class="${cls}"${act}><span class="dn">${d.getDate()}</span><div class="pips">${pips}</div>${cnt}</div>`;
  }
  return `<div class="calwrap"><div class="calhead"><h3>${MON[m]} ${y}</h3><button data-a="month" data-v="-1" aria-label="Previous month" ${curMonth?'disabled':''}>‹</button><button data-a="month" data-v="1" aria-label="Next month">›</button></div><div class="legend" aria-label="Key"><span><i class="pip"></i> a game</span><span><i class="pip ad">\u2713</i> on your calendar</span><span><b class="vis">Purple</b> = you\u2019ve opened it</span></div><div class="grid" style="grid-template-rows:auto repeat(${shown},minmax(76px,1fr))">${cells}</div></div>`;
}
function placeCount(p){const ids=new Set();ALL.forEach(e=>{if(e.type!=='cruise'&&passBase(e)&&inPlace(e,p))ids.add(e.id)});return ids.size}
function sug(p,i,pre){const n=placeCount(p);return `<button class="opt" data-a="pick" data-v="${i}">${pre||''}${esc(p.label)}<span>${n?n+' '+(n===1?'game':'games'):'No games yet'}</span></button>`}
function suggestHTML(q){
  q=q.trim().toLowerCase();
  if(!q)return `<button class="opt" data-a="geo">Use my location <span>demo</span></button><button class="opt ${S.place.kind==='all'?'sel':''}" data-a="allstates">All states</button><div class="hint">Start typing a city, state or ZIP.</div>`;
  if(/^\d+$/.test(q)){
    const hits=Object.keys(ZIPS).filter(z=>z.startsWith(q));
    if(hits.length)return hits.map(z=>{const i=PLACES.findIndex(p=>p.label===ZIPS[z]);return i<0?'':sug(PLACES[i],i,z+' · ')}).join('');
    return q.length>=5?`<div class="hint"><b>We don’t recognize that ZIP.</b><br>Try a city or state instead.</div>`:`<div class="hint">Keep typing your ZIP.</div>`;
  }
  const res=[];
  PLACES.forEach((p,i)=>{
    const name=(p.kind==='city'?p.city:p.label).toLowerCase();
    const hit=name.startsWith(q)||p.label.toLowerCase().startsWith(q)||name.split(' ').some(w=>w.startsWith(q))||(p.kind==='state'&&p.st.toLowerCase()===q);
    if(hit)res.push({p,i,n:placeCount(p)});
  });
  res.sort((a,b)=>((b.n>0)-(a.n>0))||((a.p.kind==='state'?0:1)-(b.p.kind==='state'?0:1))||(b.n-a.n)||a.p.label.localeCompare(b.p.label));
  if(res.length)return res.slice(0,6).map(r=>sug(r.p,r.i)).join('');
  const intl=INTL.some(w=>q===w||q.startsWith(w)||(w.startsWith(q)&&q.length>=3));
  return `<div class="hint"><b>${intl?'Mahjong USA lists games in the United States for now.':'We couldn’t find that place.'}</b><br>Try a US city, state or ZIP. <button class="linkbtn" data-a="submit">Know a game there? Submit it</button></div>`;
}
function fbHTML(fb){
  return fb?`<div class="nearest"><b>No games near ${esc(S.place.label)}.</b>Showing ${esc(fb.city)}, ${fb.st} instead: ${fb.count} ${fb.count===1?'game':'games'}, about ${Math.round(fb.dist)} miles away. <button class="linkbtn" data-a="pop" data-v="where">Change location</button></div>`:'';
}

  else if(rc>=3)banner=`<div class="banner" role="status"><div><b>Several people reported a problem.</b>This event may be wrong or cancelled. Confirm with the organizer before you go.</div></div>`;

  <div class="dhead"><button class="dback" data-a="closedetail">‹ All events</button><span class="sp"></span><button class="iconbtn" data-a="copy" aria-label="Copy link" title="Copy link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg></button></div>

    ${e.code?`<div class="sec"><h2>Discount code</h2><p><span class="codebox">${e.code}</span>${esc(e.codeNote||'')}</p><p class="meta" style="margin-top:6px">Enter it at registration on the organizer’s site.</p></div>`:''}

/* ---------- render ---------- */
function mountMaps(cur){
  if(map){map.remove();map=null}
  if(emap){emap.remove();emap=null}
  if(typeof L==='undefined')return;
  const m=document.getElementById('map');
  if(m){
    map=L.map(m,{scrollWheelZoom:false}).setView([39,-96],4);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
    const nx=nextUp();const seen={};const pts=[],land=[];
    const P=eff().place,near=P.kind==='city'&&!S.mapWide;
    filtered(true).forEach(e=>{
      if(seen[e.id])return;seen[e.id]=1;
      if(near&&(e.type==='cruise'||dist(P,e)>50))return;
      const ll=[e.lat,e.lng];pts.push(ll);if(e.type!=='cruise')land.push(ll);
      const isNext=nx&&nx.id===e.id,isCur=cur&&cur.id===e.id;
      const st=isCur?{radius:13,color:'#6a4fb3',weight:4,fillColor:'#0d0d0d',fillOpacity:1}:isNext?{radius:12,color:'#fff',weight:3,fillColor:'#0d0d0d',fillOpacity:1}:{radius:8,color:'#0d0d0d',weight:2,fillColor:S.seen[e.uid]?'#d9d0ee':'#fff',fillOpacity:1};
      const mk=L.circleMarker(ll,st).addTo(map);
      mk.bindTooltip(e.title,{direction:'top'});
      mk.on('click',()=>{location.hash='#event-'+e.uid});
    });
    if(near){
      const c=L.circle([P.lat,P.lng],{radius:50*1609,color:'#0d0d0d',weight:1.5,dashArray:'6 6',fillColor:'#0d0d0d',fillOpacity:.04,interactive:false}).addTo(map);
      L.circleMarker([P.lat,P.lng],{radius:16,color:'#6a4fb3',weight:2,fillColor:'#6a4fb3',fillOpacity:.15,interactive:false}).addTo(map).bringToBack();
      map.invalidateSize();map.fitBounds(c.getBounds(),{padding:[10,10]});setTimeout(()=>{if(map){map.invalidateSize();map.fitBounds(c.getBounds(),{padding:[10,10]})}},200);return;
    }
    const fit=land.length?land:pts;
    if(fit.length===1)map.setView(fit[0],9);else if(fit.length)map.fitBounds(fit,{padding:[30,30],maxZoom:9});
  }
}
function mountEventMap(e){
  if(typeof L==='undefined')return;
  const el=document.getElementById('emap');if(!el)return;
  emap=L.map(el,{scrollWheelZoom:false,zoomControl:true}).setView([e.lat,e.lng],e.privateAddr?11:15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(emap);
  if(e.privateAddr)L.circle([e.lat,e.lng],{radius:3000,color:'#0d0d0d',weight:2,fillColor:'#0d0d0d',fillOpacity:.15}).addTo(emap);
  else L.circleMarker([e.lat,e.lng],{radius:10,color:'#fff',weight:2,fillColor:'#0d0d0d',fillOpacity:1}).addTo(emap);
}
function eventFromHash(){const h=location.hash;return h.startsWith('#event-')?byUid(decodeURIComponent(h.slice(7))):null}
function render(){
  if(location.hash==='#trips'){S.types=new Set(['cruise']);history.replaceState(null,'','#home')}
  const y=scrollY;
  const pn0=document.querySelector('.panel'),st0=document.querySelector('.stage');
  const wasDetail=!!(pn0&&pn0.classList.contains('detail'));
  const prev=pn0?pn0.scrollTop:0,prevSt=st0?st0.scrollTop:0;
  if(pn0&&!wasDetail)S.listScroll=prev;
  const ev=eventFromHash();
  if(ev&&!S.seen[ev.uid]){S.seen[ev.uid]=1;lsSet('mj-seen',S.seen)}
  document.title=ev?ev.title+' | Mahjong USA':'Mahjong USA: events calendar prototype';
  document.getElementById('app').innerHTML=homeHTML();
  mountMaps(ev);
  if(ev)mountEventMap(ev);
  document.getElementById('modalroot').innerHTML=modalHTML();
  document.body.classList.toggle('lock',!!ev&&innerWidth<=900);
  const pn=document.querySelector('.panel'),st=document.querySelector('.stage');
  if(pn)pn.scrollTop=ev?((wasDetail&&S.lastUid===ev.uid)?prev:0):(wasDetail?S.listScroll:prev);
  if(st)st.scrollTop=prevSt;
  S.lastUid=ev?ev.uid:null;
  if(innerWidth<=900)scrollTo(0,y);
  const pq=document.getElementById('placeq');if(pq)pq.focus();
}
window.addEventListener('hashchange',()=>{S.pop=null;S.calOpen=false;S.modal=null;render()});

/* ---------- actions ---------- */
function setPlace(p){S.place=p;lsSet('mj-place',p);S.pop=null;S.day=null;render()}
const go=h=>{if(location.hash!==h)location.hash=h;else render()};
document.addEventListener('input',ev=>{if(ev.target.id==='placeq')document.getElementById('sugg').innerHTML=suggestHTML(ev.target.value)});
document.addEventListener('keydown',ev=>{
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('.day[role=button]')){ev.preventDefault();ev.target.click();return}
  if(ev.target.id==='placeq'&&ev.key==='Enter'){ev.preventDefault();const b=document.querySelector('#sugg [data-a=pick]');if(b)b.click()}
  if(ev.key==='Escape'){if(S.pop){S.pop=null;render()}else if(S.modal){S.modal=null;render()}else if(eventFromHash())go('#home')}
});
document.addEventListener('submit',ev=>{
  const f=ev.target.closest('form[data-a]');if(!f)return;ev.preventDefault();
  if(f.dataset.a==='sendreport'){
    const e=eventFromHash();if(!e)return;
    const r=reportsMine();r[e.id]=true;lsSet('mj-reports',r);S.modal=null;render();toast('Thanks. We’ll take a look.');
  }
});
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');
  if(S.pop&&!ev.target.closest('.popwrap')){S.pop=null;render()}
  if(S.calOpen&&!ev.target.closest('.popwrap')){S.calOpen=false;render()}
  if(ev.target.closest('a[href^="#"]')&&!ev.target.closest('a[data-a]'))return;
  if(!el)return;
  const a=el.dataset.a,v=el.dataset.v;
  if(el.tagName==='FORM')return;
  if(a==='closemodal'){if(ev.target.closest('.modal')&&!el.matches('button'))return;S.modal=null;render();return}
  if(a==='pop'){S.pop=S.pop===v?null:v;render();return}
  if(a==='pick'){setPlace(PLACES[Number(v)]);return}
  if(a==='allstates'){setPlace({kind:'all',label:'All states'});return}
  if(a==='geo'){setPlace(PLACES.find(p=>p.label==='Charleston, SC'));toast('Demo: using Charleston, SC');return}
  if(a==='type'){if(S.types.has(v))S.types.delete(v);else S.types.add(v);if(!S.types.size)S.types=new Set(ALLTYPES);S.day=null;render();return}
  if(a==='typeall'){S.types=new Set(ALLTYPES);S.day=null;render();return}
  if(a==='style'){S.style=v;S.pop=null;render();return}
  if(a==='cost'){S.cost=v;S.pop=null;render();return}
  if(a==='view'){S.view=v;render();return}
  if(a==='mapwide'){S.mapWide=!S.mapWide;render();return}
  if(a==='goev'){go('#event-'+v);return}
  if(a==='day'){S.day=S.day===v?null:v;S.more=false;if(eventFromHash())go('#home');else render();return}
  if(a==='more'){S.more=true;render();return}
  if(a==='month'){let {y,m}=S.month;m+=Number(v);if(m<0){m=11;y--}if(m>11){m=0;y++}S.month={y,m};render();return}
  if(a==='when'){S.when=v;S.day=null;render();return}
  if(a==='clear'){S.types=new Set(ALLTYPES);S.style='any';S.cost='any';S.when='any';S.day=null;S.pop=null;render();return}
  if(a==='closedetail'){go('#home');return}
  if(a==='submit'){S.modal='submit';render();return}
  if(a==='report'){S.modal='report';render();return}
  if(a==='unreport'){const e=eventFromHash();if(e){const r=reportsMine();delete r[e.id];lsSet('mj-reports',r);render();toast('Report removed')}return}
  if(a==='copy'){const u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Link copied'),()=>toast('Copy this link: '+u));return}
  if(a==='calmenu'){S.calOpen=!S.calOpen;render();return}
  if(a==='gcal'){markAdded(v);S.calOpen=false;setTimeout(render,0);return}
  if(a==='ics'){const e=eventFromHash();if(e){downloadIcs(e);markAdded(e.uid);S.calOpen=false;render();toast('Calendar file downloaded')}return}
  if(a==='soon'){ev.preventDefault();toast(v||'Coming soon');return}
});
render();
</script>
</body>
</html>
