<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mahjong USA: events calendar prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#0d0d0d;--paper:#fff;--gray:#f3f3f1;--line:#d6d6d2;--mute:#666;--warn:#fff4d6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;line-height:1.45}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.sr{position:absolute;left:-9999px}

/* header */
.top{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:2px solid var(--ink)}
.top .wrap{display:flex;align-items:center;gap:24px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em;text-decoration:none}
.mark{width:26px;height:32px;border:2.5px solid var(--ink);border-radius:6px;box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;font-size:15px;font-weight:800}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a,.nav button{padding:8px 12px;border-radius:999px;text-decoration:none;font-weight:600;font-size:15px;background:none;border:0}
.nav a:hover,.nav button:hover{background:var(--gray)}
.nav .cta{border:2px solid var(--ink)}

/* toolbar */
.tb{display:flex;align-items:center;gap:26px;flex-wrap:wrap;padding:16px 0 14px}
.tbtn{background:none;border:0;padding:6px 0;font-weight:600;font-size:15px;color:var(--ink)}
.tbtn small{color:var(--mute);font-weight:500;font-size:14px}
.tb .right{margin-left:auto;display:flex;gap:20px}
.tab{background:none;border:0;padding:6px 0;font-size:15px;font-weight:500;color:var(--mute);border-bottom:2px solid transparent}
.tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.popwrap{position:relative}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:60;min-width:260px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.14)}
.pop h4{margin:6px 8px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.opt{display:flex;align-items:center;width:100%;padding:9px 10px;border:0;background:none;border-radius:8px;text-align:left;font-weight:500;font-size:15px}
.opt:hover{background:var(--gray)}
.opt.sel{font-weight:700}
.opt:not(.chkopt).sel::after{content:'\2713';margin-left:auto;padding-left:12px}
.opt span{color:var(--mute);font-size:13px;margin-left:auto;padding-left:12px}
.opt .bx{width:18px;height:18px;border:1.5px solid var(--ink);border-radius:5px;margin:0 10px 0 0;padding:0;display:grid;place-items:center;font-size:12px;color:#fff;flex:none}
.opt.chkopt.sel .bx{background:var(--ink)}
.plink{padding:2px 10px 6px;font-size:13px}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.placeq{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;margin-bottom:6px}
.popw{min-width:340px}
.hint{padding:10px;font-size:14px;color:var(--mute);line-height:1.4}
.hint b{color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;font-weight:600;font-size:inherit}

/* next up: the one heavy thing */
.nextbar{display:flex;align-items:center;justify-content:space-between;gap:16px 28px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:16px;padding:18px 24px;margin:0 0 18px}
.nextbar .nl{margin:0;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#bdbdb8}
.nextbar h2{margin:4px 0 2px;font-size:24px;line-height:1.15;letter-spacing:-.02em;font-weight:800}
.nextbar .nm{margin:0;font-size:15px;color:#d6d6d1}
.na{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.nbtn{display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:999px;background:#fff;color:var(--ink);font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
.nlink{color:#fff;font-size:14px;font-weight:600;white-space:nowrap}
.nearest{background:var(--gray);border-radius:14px;padding:14px 16px;margin:0 0 16px;font-size:15px}
.nearest b{display:block;font-size:16px;margin-bottom:2px}

/* calendar: full width, quiet cells, click a day */
.stage{padding-bottom:70px}
.calhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.calhead h3{margin:0 8px 0 0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.calhead button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.dow{padding:8px 10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.day{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:4px;background:#fff;min-width:0}
.day.has{cursor:pointer}
.day.has:hover{background:#f7f7f4}
.day.out{background:#fafaf8}
.day.out .dn,.day.past .dn{color:#c4c4c0}
.day.sel{background:#f0f0ec}
.dn{font-size:13px;font-weight:600;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;margin-left:-4px}
.day.today .dn{border:1.5px solid var(--ink)}
.pips{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:4px}
.pip{width:9px;height:9px;border-radius:50%;background:var(--ink);display:block;font-style:normal}
.pip.nx{width:12px;height:12px;box-shadow:0 0 0 3px #d6d6d2}
.pip.ad{background:none;width:auto;height:auto;font-size:13px;font-weight:800;line-height:1;border-radius:0}
.cnt{font-size:12px;color:var(--mute);margin-top:auto}
#map{height:calc(100vh - 230px);min-height:520px;border:1px solid var(--line);border-radius:16px;background:var(--gray)}
.leaflet-tile{filter:grayscale(1) contrast(1.05)}
.leaflet-popup-content a{font-weight:700}

/* day popup */
.daypop{position:fixed;z-index:1500;width:340px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.2);padding:6px 6px 8px}
.dph{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 6px}
.dph b{font-size:16px}
.x{width:32px;height:32px;border-radius:50%;border:0;background:none;font-size:22px;line-height:1}
.x:hover{background:var(--gray)}
.dr{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:10px;text-decoration:none}
.dr:hover{background:var(--gray)}
.dr .dt{flex:none;width:66px;font-size:13px;font-weight:600;color:var(--mute);padding-top:2px}
.dr .db{display:flex;flex-direction:column;min-width:0;flex:1}
.dr b{font-size:15px;font-weight:700}
.dr .rm{font-size:13px;color:var(--mute)}
.ok{font-weight:800;font-size:16px}
.seen{color:#6a4fb3}

/* event overlay */
.ovp{position:relative;background:#fff;border-radius:20px;width:100%;max-width:760px;max-height:92vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.ovxw{position:sticky;top:0;height:0;z-index:5;display:flex;justify-content:flex-end}
.ovx{margin:12px 12px 0 0;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px;line-height:1}
.ovb{padding:26px 28px 12px}
.ovbar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:12px;align-items:center}
.ovbar .when{font-weight:800;font-size:16px;line-height:1.2}
.ovbar .when small{display:block;font-weight:500;font-size:13px;color:var(--mute)}
.ovbar .acts{margin-left:auto;display:flex;gap:8px}
.ehead{display:flex;gap:18px;align-items:center;margin:0 44px 18px 0}
.ehead h1{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.03em;font-weight:800}
.sec{margin:0 0 26px}
.sec h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px;color:var(--mute)}
.sec p{margin:0;font-size:16px}
.box{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;margin-bottom:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--ink);background:#fff;font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--ink);color:#fff}
.btn.full{width:100%}
.btn[disabled]{border-style:dashed;color:#999;border-color:#bbb;cursor:not-allowed}
.btn em{font-style:normal;font-size:11px;background:var(--gray);border-radius:6px;padding:1px 6px;color:var(--mute)}
.row2{display:flex;gap:8px;margin-top:10px}.row2>*{flex:1}
#emap{height:180px;border-radius:12px;border:1px solid var(--line);margin:12px 0}
.banner{border:1.5px solid var(--ink);background:var(--warn);border-radius:14px;padding:14px 16px;margin:0 0 18px;font-size:15px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.banner b{display:block}
.banner button{margin-left:auto;background:none;border:0;text-decoration:underline;font-weight:600}
.org{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:14px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
details{border-bottom:1px solid var(--line);padding:10px 0}
summary{font-weight:600;cursor:pointer;font-size:15px}
details p{margin-top:6px;color:var(--mute);font-size:14px}
.mini{display:grid;grid-template-columns:1fr;gap:6px}
.mini .card{border:1px solid var(--line);padding:10px}
.codebox{display:inline-block;border:2px dashed var(--ink);border-radius:8px;padding:4px 10px;font-weight:800;letter-spacing:.06em;margin-right:8px}
.calmenu{position:absolute;bottom:calc(100% + 8px);right:0;min-width:230px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.calmenu a,.calmenu button{display:block;width:100%;padding:10px 12px;text-align:left;border:0;background:none;border-radius:8px;font-weight:600;font-size:15px;text-decoration:none}
.calmenu a:hover,.calmenu button:hover{background:var(--gray)}
.foot{border-top:1px solid var(--line);padding:28px 0 60px;color:var(--mute);font-size:14px}

/* cards (inside overlay lists) */
.card{display:flex;gap:14px;align-items:center;padding:10px;text-decoration:none;border-radius:12px}
.card:hover{background:var(--gray)}
.tile{flex:none;width:54px;height:66px;border:2.5px solid var(--ink);border-radius:10px;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;line-height:1}
.tile .m{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tile .d{font-size:26px;font-weight:800;margin-top:4px}
.card h3{margin:0;font-size:16px;font-weight:700;line-height:1.25}
.meta{margin-top:3px;font-size:14px;color:var(--mute)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:12px;font-weight:700;border:1.5px solid var(--ink);border-radius:6px;padding:1px 7px;background:#fff}
.tag.solid{background:var(--ink);color:#fff}
.tag.soft{border-color:var(--line);color:var(--mute);font-weight:600}
.tag.warn{background:var(--warn)}
.card .go{margin-left:auto;font-size:22px;font-weight:700}
.card h3.seen{color:#6a4fb3}


/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(13,13,13,.5);z-index:2000;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:22px;width:100%;max-width:440px;box-shadow:8px 8px 0 var(--ink)}
.modal h3{margin:0 0 6px;font-size:22px}
.modal p{margin:0 0 12px;color:var(--mute)}
.radio{display:flex;gap:10px;align-items:center;padding:10px 4px;font-weight:500;font-size:16px}
.radio input{width:20px;height:20px;accent-color:#000}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:3000;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media(max-width:900px){
  .wrap{padding:0 16px}
  .tb{gap:18px}
  .tb .right{margin-left:0;width:100%}
  .nextbar{padding:16px 18px}
  .nextbar h2{font-size:21px}
  .day{min-height:54px;padding:4px 2px;align-items:center}
  .dow{padding:6px 2px;text-align:center;font-size:11px}
  .dn{margin-left:0;width:24px;height:24px}
  .pips{gap:3px;justify-content:center;margin-top:2px}
  .pip{width:7px;height:7px}
  .pip.nx{width:9px;height:9px;box-shadow:0 0 0 2px #d6d6d2}
  .pip.ad{font-size:11px}
  .cnt{display:none}
  .calhead h3{font-size:20px}
  #map{height:400px;min-height:0}
  .daypop{left:0;right:0;bottom:0;top:auto;width:auto;max-height:65vh;border-radius:18px 18px 0 0}
  .ovs{padding:0;align-items:end}
  .ovp{max-height:94vh;border-radius:18px 18px 0 0}
  .ovb{padding:22px 18px 8px}
  .ehead h1{font-size:25px}
  .ehead{align-items:flex-start}
  .ovbar{padding:10px 14px}
  .ovbar .when small{display:none}
  .ovbar .when{font-size:14px}
  .ovbar .btn{padding:0 12px;font-size:14px}
}

</style>
</head>

<main id="app"></main>

    </div>
    ${fbHTML(eff().fb)}
    ${none?`<div class="nearest"><b>No games match these filters.</b><button class="linkbtn" data-a="clear">Clear filters</button></div>`:nextBar(nx)}
    ${pane}
    ${dayPopHTML()}
  </div>
  <footer class="foot"><div class="wrap">Sample layout with made-up events. Black and white until the logo and brand colors arrive.</div></footer>`;
}

/* ---------- event overlay ---------- */
function eventOverlay(e){
  const o=ORGS[e.org];const rc=reportCount(e);const mine=!!reportsMine()[e.id];
  const t=TYPES[e.type];
  let banner='';
  if(rc===1)banner=`<div class="banner" role="status"><div><b>1 person reported a problem with this event.</b>Check the details with the organizer before you go.</div>${mine?'<button data-a="unreport">Undo my report</button>':''}</div>`;
  else if(rc>=3)banner=`<div class="banner" role="status"><div><b>Several people reported a problem.</b>This event may be wrong or cancelled. Confirm with the organizer before you go.</div></div>`;
  else if(rc===2)banner=`<div class="banner" role="status"><div><b>2 people reported a problem with this event.</b>Check the details with the organizer before you go.</div>${mine?'<button data-a="unreport">Undo my report</button>':''}</div>`;
  const hostEvents=ALL.filter(x=>x.org===e.org&&x.id!==e.id&&x.date>=TISO).filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i).slice(0,3);
  const stateEvents=ALL.filter(x=>x.st===e.st&&x.id!==e.id&&x.org!==e.org&&x.date>=TISO).filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i).slice(0,4);
  const faq=[
    ['Do I need to bring my own set?',e.type==='cruise'?'Sets are provided in the card room. Check with the organizer for details.':'Most hosts provide sets. Check with the organizer if you want to be sure.'],
    ['Is this beginner friendly?',e.beginner?'Yes. Beginners are welcome.':'This one is better if you already know the rules. Check lessons near you if you are new.'],
    ['Do I need a partner?','No. You will be seated at a table with other players.']
  ];
  const where=e.privateAddr?`${esc(e.city)}, ${e.st}<br><span class="meta">The host shares the exact address privately. Message them for it.</span>`:`${esc(e.venue)}<br>${esc(e.city)}, ${e.st}`;
  const added=isAdded(e);
  return `<div class="scrim ovs" data-a="closeov"><div class="ovp" role="dialog" aria-modal="true" aria-label="${esc(e.title)}">
  <div class="ovxw"><button class="x ovx" data-a="closeov" aria-label="Close">×</button></div>
  <div class="ovb">
    ${banner}
    <div class="ehead">${tile(e)}<div><h1>${esc(e.title)}</h1><div class="tags" style="margin-top:10px"><span class="tag solid">${t.g} ${t.label}</span><span class="tag">${e.style}</span>${e.beginner?'<span class="tag">Beginner friendly</span>':''}${e.rec?`<span class="tag soft">Every ${DOW[parse(e.date).getDay()]}</span>`:''}</div></div></div>
    <div class="box">
      <b style="font-size:17px">${timeText(e)}</b>
      <div style="margin-top:6px">${where}</div>
      <div id="emap" role="img" aria-label="Map of the event location"></div>
      <a class="btn full" href="${dirUrl(e)}" target="_blank" rel="noopener">Get directions ↗</a>
      <div class="row2"><button class="btn" data-a="copy">Copy link</button><button class="btn" data-a="soon" data-v="Demo: opens the share sheet on a phone">Share</button></div>
      <div class="row2"><button class="btn" disabled>Save <em>Soon</em></button><button class="btn" disabled>Follow host <em>Soon</em></button></div>
    </div>
    <div class="sec"><h2>About</h2><p>${esc(e.desc)}</p><p class="meta" style="margin-top:8px">${money(e.price)}${e.spots?' · '+e.spots+' spots left':''}</p></div>
    ${e.refund?`<div class="sec"><h2>Refunds</h2><p>${esc(e.refund)}</p><p class="meta" style="margin-top:6px">As stated by the organizer. Mahjong USA does not handle payments.</p></div>`:''}
    ${e.code?`<div class="sec"><h2>Discount code</h2><p><span class="codebox">${e.code}</span>${esc(e.codeNote||'')}</p><p class="meta" style="margin-top:6px">Enter it at registration on the organizer’s site.</p></div>`:''}
    <div class="sec"><h2>Good to know</h2>${faq.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div>
    <div class="sec"><h2>Organizer</h2><div class="org"><div class="avatar">${o.n[0]}</div><div><b>${o.n}</b><div class="meta">${o.y} years on Mahjong USA · ${o.c} events listed</div></div><a class="btn" style="margin-left:auto" href="javascript:void 0" data-a="soon" data-v="Opens the organizer’s own page">Their page ↗</a></div></div>
    <div class="sec"><p class="meta">Last checked Nov 16, 2026 · <button class="linkbtn" data-a="report">${mine?'You reported this':'Report a problem'}</button> · <button class="linkbtn" data-a="soon" data-v="Demo: this would email the Mahjong USA team">Is this your event? Fix or remove it</button></p></div>
    ${hostEvents.length?`<div class="sec"><h2>More from ${o.n}</h2><div class="mini">${hostEvents.map(x=>cardHTML(x)).join('')}</div></div>`:''}
    ${stateEvents.length?`<div class="sec"><h2>More in ${STATES[e.st].n}</h2><div class="mini">${stateEvents.map(x=>cardHTML(x)).join('')}</div></div>`:''}
  </div>
  <div class="ovbar">
    <div class="when">${e.allDay?fmtDay(e.date):fmtDay(e.date)+' · '+t12(e.time)} <small>${money(e.price)}${e.spots?' · '+e.spots+' spots left':''} · ${e.tz}</small></div>
    <div class="acts">
      <div class="popwrap"><button class="btn ${added?'':'pri'}" data-a="calmenu">${added?'✓ Added':'Add to calendar'} ▾</button>
      ${S.calOpen?`<div class="calmenu"><a href="${googleUrl(e)}" data-a="gcal" data-uid="${e.uid}" target="_blank" rel="noopener">Google Calendar</a><button data-a="ics">Apple Calendar (.ics)</button><button data-a="ics">Outlook (.ics)</button></div>`:''}</div>
      <a class="btn" href="javascript:void 0" data-a="soon" data-v="Demo: opens the organizer’s registration page">${e.price===0?'Details':'Register'} ↗</a>
    </div>
  </div></div></div>`;
}

/* ---------- render ---------- */
function mountMaps(){
  if(map){map.remove();map=null}
  if(emap){emap.remove();emap=null}
  if(typeof L==='undefined')return;
  const m=document.getElementById('map');
  if(m){
    map=L.map(m,{scrollWheelZoom:false}).setView([39,-96],4);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
    const nx=nextUp();const seen={};const pts=[];
    filtered(false).forEach(e=>{
      if(seen[e.id])return;seen[e.id]=1;
      const ll=[e.lat,e.lng];pts.push(ll);
      const isNext=nx&&nx.id===e.id;
      L.circleMarker(ll,isNext?{radius:12,color:'#fff',weight:3,fillColor:'#0d0d0d',fillOpacity:1}:{radius:7,color:'#0d0d0d',weight:2,fillColor:'#fff',fillOpacity:1}).addTo(map)
        .bindPopup(`<b>${esc(e.title)}</b><br>${fmtDay(e.date)} · ${money(e.price)}<br><a href="#event-${e.uid}">View event ›</a>`);
    });
    if(pts.length===1)map.setView(pts[0],9);else if(pts.length)map.fitBounds(pts,{padding:[30,30],maxZoom:9});
  }
}
function mountEventMap(e){
  if(typeof L==='undefined')return;
  const el=document.getElementById('emap');if(!el)return;
  emap=L.map(el,{scrollWheelZoom:false,zoomControl:true}).setView([e.lat,e.lng],e.privateAddr?11:15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(emap);
  if(e.privateAddr)L.circle([e.lat,e.lng],{radius:3000,color:'#0d0d0d',weight:2,fillColor:'#0d0d0d',fillOpacity:.15}).addTo(emap);
  else L.circleMarker([e.lat,e.lng],{radius:10,color:'#fff',weight:2,fillColor:'#0d0d0d',fillOpacity:1}).addTo(emap);
}
function eventFromHash(){const h=location.hash;return h.startsWith('#event-')?(byUid(decodeURIComponent(h.slice(7)))||null):null}
function modalHTML(ev){
  let out=ev?eventOverlay(ev):'';
  if(S.modal==='report'){
    out+=`<div class="scrim" data-a="closemodal"><div class="modal" role="dialog" aria-modal="true" aria-label="Report a problem"><h3>Report a problem</h3><p>No sign-in needed. We’ll look at it.</p>
    <form data-a="sendreport">${['The date or time is wrong','It was cancelled','The place is wrong','It looks like spam','Something else'].map((r,i)=>`<label class="radio"><input type="radio" name="r" value="${r}" ${i===0?'checked':''}>${r}</label>`).join('')}
    <div class="row2" style="margin-top:12px"><button type="button" class="btn" data-a="closemodal">Cancel</button><button class="btn pri">Send report</button></div></form></div></div>`;
  }
  if(S.modal==='submit'){
    out+=`<div class="scrim" data-a="closemodal"><div class="modal" role="dialog" aria-modal="true"><h3>Submit an event</h3><p>Coming next: paste a link, the text of your post, or a photo of your flyer, and we fill in the details for you to check. Your event goes through a quick review before it appears.</p><button class="btn pri full" data-a="closemodal">Got it</button></div></div>`;
  }
  return out;
}
function render(keepScroll,resetOv){
  const y=scrollY;const op=document.querySelector('.ovp');const ost=op?op.scrollTop:0;
  const ev=eventFromHash();
  if(ev&&!S.seen[ev.id]){S.seen[ev.id]=1;lsSet('mj-seen',S.seen)}
  document.title=ev?ev.title+' | Mahjong USA':'Mahjong USA: events calendar prototype';
  document.getElementById('app').innerHTML=homeHTML();
  mountMaps();
  document.getElementById('modalroot').innerHTML=modalHTML(ev);
  if(ev)mountEventMap(ev);
  document.body.style.overflow=(ev||S.modal)?'hidden':'';
  const np=document.querySelector('.ovp');if(np&&!resetOv)np.scrollTop=ost;
  positionDayPop();
  const pq=document.getElementById('placeq');if(pq)pq.focus();
  if(keepScroll)scrollTo(0,y);
}
function closeOverlay(){S.calOpen=false;location.hash='#home'}
window.addEventListener('hashchange',()=>{S.pop=null;S.calOpen=false;S.modal=null;S.dayOpen=null;render(true,true)});
window.addEventListener('resize',positionDayPop);

/* ---------- actions ---------- */
function setPlace(p){S.place=p;lsSet('mj-place',p);S.pop=null;S.dayOpen=null;render(true)}
function markAdded(uid){S.added[uid]=true;lsSet('mj-added',S.added)}
document.addEventListener('input',ev=>{if(ev.target.id==='placeq')document.getElementById('sugg').innerHTML=suggestHTML(ev.target.value)});
document.addEventListener('keydown',ev=>{
  if(ev.target.id==='placeq'&&ev.key==='Enter'){ev.preventDefault();const b=document.querySelector('#sugg [data-a=pick]');if(b)b.click()}
  if(ev.key==='Escape'){
    if(S.modal){S.modal=null;render(true)}
    else if(S.pop||S.calOpen){S.pop=null;S.calOpen=false;render(true)}
    else if(eventFromHash())closeOverlay();
    else if(S.dayOpen){S.dayOpen=null;render(true)}
  }
});
document.addEventListener('submit',ev=>{
  const f=ev.target.closest('form[data-a]');if(!f)return;ev.preventDefault();
  if(f.dataset.a==='sendreport'){
    const e=eventFromHash();if(!e)return;
    const r=reportsMine();r[e.id]=true;lsSet('mj-reports',r);S.modal=null;render(true);toast('Thanks. We’ll take a look.');
  }
});
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');
  if(S.pop&&!ev.target.closest('.popwrap')){S.pop=null;render(true)}
  if(S.calOpen&&!ev.target.closest('.popwrap')){S.calOpen=false;render(true)}
  if(S.dayOpen&&!ev.target.closest('.daypop,.day.has')){S.dayOpen=null;render(true)}
  if(ev.target.closest('a[href^="#"]')&&!ev.target.closest('a[data-a]'))return;
  if(!el)return;
  const a=el.dataset.a,v=el.dataset.v;
  if(el.tagName==='FORM')return;
  if(a==='closemodal'){if(ev.target.closest('.modal')&&!el.matches('button'))return;S.modal=null;render(true);return}
  if(a==='closeov'){if(ev.target===el||ev.target.closest('.ovx'))closeOverlay();return}
  if(a==='closeday'){S.dayOpen=null;render(true);return}
  if(a==='pop'){S.pop=S.pop===v?null:v;render(true);return}
  if(a==='pick'){setPlace(PLACES[Number(v)]);return}
  if(a==='allstates'){setPlace({kind:'all',label:'All states'});return}
  if(a==='geo'){setPlace(PLACES.find(p=>p.label==='Charleston, SC'));toast('Demo: using Charleston, SC');return}
  if(a==='type'){if(S.types.has(v))S.types.delete(v);else S.types.add(v);if(!S.types.size)S.types=new Set(ALLTYPES);S.dayOpen=null;render(true);return}
  if(a==='typeall'){S.types=new Set(ALLTYPES);S.dayOpen=null;render(true);return}
  if(a==='style'){S.style=v;S.pop=null;render(true);return}
  if(a==='cost'){S.cost=v;S.pop=null;render(true);return}
  if(a==='view'){S.view=v;S.dayOpen=null;render(true);return}
  if(a==='day'){S.dayOpen=S.dayOpen===v?null:v;render(true);return}
  if(a==='month'){let {y,m}=S.month;m+=Number(v);if(m<0){m=11;y--}if(m>11){m=0;y++}S.month={y,m};S.dayOpen=null;render(true);return}
  if(a==='clear'){S.types=new Set(ALLTYPES);S.style='any';S.cost='any';S.dayOpen=null;S.pop=null;render(true);return}
  if(a==='submit'){S.modal='submit';render(true);return}
  if(a==='report'){S.modal='report';render(true);return}
  if(a==='unreport'){const e=eventFromHash();if(e){const r=reportsMine();delete r[e.id];lsSet('mj-reports',r);render(true);toast('Report removed')}return}
  if(a==='copy'){const u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Link copied'),()=>toast('Copy this link: '+u));return}
  if(a==='calmenu'){S.calOpen=!S.calOpen;render(true);return}
  if(a==='gcal'){markAdded(el.dataset.uid);S.calOpen=false;setTimeout(()=>render(true),0);return}
  if(a==='ics'){const e=eventFromHash();if(e){downloadIcs(e);markAdded(e.uid);S.calOpen=false;render(true);toast('Calendar file downloaded')}return}
  if(a==='soon'){ev.preventDefault();toast(v||'Coming soon');return}
});
render();
</script>
</body>
</html>
