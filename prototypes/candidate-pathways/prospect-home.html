/* ------------------------------- helpers -------------------------------- */
/* Only Section 1 ("Know your values") is actually built out. Its four lessons
   map one-to-one onto the stops in the Values Flow, so clicking a lesson opens
   that exact stop. Everything else is a demo shell and says so when tapped. */
const STOP_BY_SUB = {
  'exp-start':    'start',
  'exp-family':   'family',
  'exp-volly':    'volunteer',
  'exp-position': 'positioning',
  'exp-values':   'values',
};
function flowHref(sub) {
  const stop = sub && STOP_BY_SUB[sub.id];
  return stop ? `values-flow.html?stop=${stop}` : null;
}
// A single piece of content is linkable on its own, so it can be texted around.
function itemHref(sub, it) { return flowHref(sub) ? `values-flow.html?item=${it.id}` : null; }
// A section's link points at the first stop that actually exists inside it.
function moduleHref(m) {
  const first = m.subtopics.find((s) => flowHref(s));
  return first ? flowHref(first) : null;
}
// A module is prototyped only if at least one of its lessons opens the flow.
function moduleBuilt(m) { return m.subtopics.some((s) => !!STOP_BY_SUB[s.id]); }

/* ---------------------------------------------------------------------------
   Progress is NOT baked into the data. It comes from the same store the Values
   Flow writes as you go, so this page only ever claims what you actually did.
   --------------------------------------------------------------------------- */
const STORE_LS = 'cp-values-flow-v3';
/* First visit seeds a realistic in-progress state (Section 1 partway, a few
   actions skipped) so the pathway has something to show; real activity in the
   Values Flow overrides it. Shared with the coach's Prospect Profile view. */
const DEFAULT_LOG = {
  'O-01': 'a', 'O-02': 'a', 'O-03': 'a',   // Getting started: answered
  'A-69': 'done', 'A-70': 'done',          // Family & personal decision: done
  'Q-03.1': 'yes',                         // Low-stakes volunteering: reached
  'A-61': 'done',                          // one action done; A-62 / A-64 / A-68 left open
};
function loadLog() {
  try {
    const raw = localStorage.getItem(STORE_LS);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  try { localStorage.setItem(STORE_LS, JSON.stringify(DEFAULT_LOG)); } catch (e) {}
  return { ...DEFAULT_LOG };
}
/* what the flow records: 'done' / 'saved' for an action, 'watched' for a video,
   and the answer itself for a question. */
function itemDone(it, log) {
  const v = log[it.id];
  if (it.type === 'action') return v === 'done';
  if (it.type === 'video')  return v === 'watched';
  return v !== undefined && v !== null && v !== '';
}
function itemSaved(it, log) { return it.type === 'action' && log[it.id] === 'saved'; }

/* A subsection holds items (a built section) or is a bare lesson with one
   attached action (the demo shells). Both shapes answer the same questions. */
function subItems(s) {
  if (s.items) return s.items;
  return s.action ? [{ id: s.id + '-a', type: 'action', title: s.action.title }] : [];
}
function subStarted(s, log) { return subItems(s).some((i) => log[i.id] !== undefined); }
// An action is only "open" once you have actually reached it, or parked it.
function subOpenActions(s, log) {
  return subItems(s).filter((i) => i.type === 'action' && !itemDone(i, log)
                                   && (subStarted(s, log) || itemSaved(i, log)));
}

/* Time estimates are deliberately NOT shown anywhere: the team felt they
   discourage people. The per-item `mins` data stays for future use. */

// A lesson is done only when every item inside it is done. An empty subsection
// (a demo shell with nothing built) is never done.
function subComplete(s, log) {
  const its = subItems(s);
  return its.length > 0 && its.every((i) => itemDone(i, log));
}
function lessonsDone(m, log) { return m.subtopics.filter((s) => subComplete(s, log)).length; }
function openActions(m, log) { return m.subtopics.flatMap((s) => subOpenActions(s, log)); }
function moduleComplete(m, log) {
  return m.subtopics.length > 0 && lessonsDone(m, log) === m.subtopics.length && openActions(m, log).length === 0;
}

// The green fill counts every item, so nothing is filled until you do it.
function moduleUnits(m) { return m.subtopics.reduce((n, s) => n + subItems(s).length, 0); }
function moduleUnitsDone(m, log) {
  return m.subtopics.reduce((n, s) => n + subItems(s).filter((i) => itemDone(i, log)).length, 0);
}
function moduleProgress(m, log) { const u = moduleUnits(m); return u ? moduleUnitsDone(m, log) / u : 0; }
// The lesson you stopped on: the first one not finished.
function stoppedAt(m, log) { return m.subtopics.find((s) => !subComplete(s, log)) || null; }
// Within a subsection, the first item not finished: the exact spot to resume.
function stoppedItem(s, log) { return subItems(s).find((i) => !itemDone(i, log)) || null; }
// Where you are in the pathway: the first section you have not finished.
function currentModule(log) { return MODULES.find((m) => !moduleComplete(m, log)) || MODULES[0]; }

function statusLine(m, log) {
  const total = m.subtopics.length, done = lessonsDone(m, log);
  if (done === 0 && !moduleUnitsDone(m, log)) {
    return `Not started · ${total} lessons`;
  }
  if (moduleComplete(m, log)) return `${done} of ${total} lessons · all actions done`;
  return `${done} of ${total} lessons done`;
}

// Everything you have reached but not finished, across the whole pathway.
function buildTodo(log) {
  return MODULES.flatMap((m) =>
    m.subtopics.flatMap((s) => subOpenActions(s, log).map((a) => ({ mod: m, sub: s, action: a }))));
}

/* Which module the candidate is on now; drives the default-open section. */


/* Sections with no content carry this note; the shared CP-DEMO-NOTICE handler at

const NOT_BUILT = 'Only the first section, Know your values, is prototyped out. The rest of the pathway is not built yet.';

/* ===================== Modules list (all sections, expandable) ==========
   The alternate view. Every section is a collapsible row; expanding it lists
   its subsections with a completion check. No action/video labels here: a
   subsection can hold several courses, videos and actions, so we only show
   whether it is done. Tapping any subsection jumps into the full-screen flow.
   ========================================================================= */
/* Copies a shareable link to any section, subsection or piece of content, so it
   can be pasted into a text. Absolute URL, so it survives the trip. */
function CopyLink({ href, label }) {
  const [copied, setCopied] = React.useState(false);
  const copy = (e) => {
    e.preventDefault();
    e.stopPropagation();
    const url = new URL(href, window.location.href).href;
    const flash = () => { setCopied(true); setTimeout(() => setCopied(false), 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(flash, flash);
    } else { flash(); }
  };
  return (
    <button type="button" onClick={copy}
            title={copied ? 'Copied to clipboard' : `Copy link to ${label}`}
            aria-label={copied ? 'Link copied to clipboard' : `Copy link to ${label}`}
            className={`relative z-30 inline-flex shrink-0 items-center gap-1 rounded p-1 text-[11px] font-extrabold transition ${copied ? 'text-appledark' : 'text-silver hover:text-azure'}`}>
      {copied ? Icon.check('h-4 w-4') : Icon.link('h-4 w-4')}
      {copied && <span>Copied</span>}
    </button>
  );
}

/* what each piece of content is, so you can tell an action from a lesson */

                  {m.coachCheckIn && (
                    <div className="mb-2.5 flex items-start gap-3 rounded-[9px] bg-white px-3.5 py-3 shadow-[0_0_6px_0_rgba(0,0,0,0.08)]">
                      <span className="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-azure/10 text-azure">{Icon.coach('h-5 w-5')}</span>

                          {Icon.message('h-3.5 w-3.5')} Message your coach

                      </div>
                    </div>

                  {m.insight && (
                    <p className="mb-3 border-l-2 border-azure/40 py-0.5 pl-4 font-lato text-[15px] leading-relaxed text-boulder">{m.insight}</p>
                  )}
                  <div className="space-y-1">
                    {m.subtopics.map((s, i) => {
                      const watched = subComplete(s, log);
                      const isStop = !!stop && s.id === stop.id;
                      const href = flowHref(s);
                      const open = subOpenActions(s, log).length;
                      const done = subComplete(s, log);

                      /* A built subsection opens a second caret onto its items. */
                      if (s.items) {

                        return (

                                {s.items.map((it) => {
                                  const ih = itemHref(s, it);

                                          {isItemStop && <span className="block text-[10px] font-extrabold uppercase tracking-wide text-azure">Start here</span>}

                                          <span className="mt-0.5 block text-[11px] font-normal text-dusty">

                                      {itDone

                           className={`group flex items-center gap-3 rounded-[9px] px-2.5 py-2.5 transition-colors ${isStop ? 'bg-azure/[0.08]' : 'hover:bg-white'}`}>
                          <span className="w-4 shrink-0 text-[12px] font-normal text-dusty">{i + 1}</span>
                          <span className="min-w-0 flex-1">
                            <span className={`block text-[13.5px] leading-tight ${isStop ? 'font-extrabold text-azure' : watched ? 'font-normal text-boulder' : 'font-normal text-mineshaft'}`}>{s.title}</span>
                            {isStop && <span className="mt-0.5 block text-[11.5px] font-normal text-azure/80">You stopped here</span>}
                          </span>
                          {watched
                            ? <span className="grid h-5 w-5 shrink-0 place-items-center rounded-full text-appledark ring-1 ring-appledark/50">{Icon.check('h-3 w-3')}</span>
                            : isStop
                              ? <span className="inline-flex shrink-0 items-center gap-1.5 rounded-full bg-azure px-3.5 py-1.5 text-[12px] font-extrabold text-white">Resume {Icon.arrow('h-3.5 w-3.5')}</span>
                              : Icon.arrow('h-4 w-4 shrink-0 text-silver group-hover:text-azure')}
                        </a>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </section>
  );
}

/* ======================= Next actions (right rail) =======================
   Every action you have reached but not finished, across the whole pathway.
   Sits beside the lessons on wide screens so it never pushes them down. */
function NextActions({ todo }) {
  if (!todo.length) return null;
  return (
    <section className="rounded-[9px] bg-white p-4 shadow-[0_0_6px_0_rgba(0,0,0,0.08)] sm:p-5">
      <div className="flex items-baseline gap-2.5 border-b border-mercury pb-3">

        <span className="text-[13px] font-normal text-dusty">{todo.length} open</span>
      </div>
      <div className="divide-y divide-mercury">
        {todo.map((t, i) => {
          // deep-link straight to the specific action, not the section start
          const href = itemHref(t.sub, t.action) || flowHref(t.sub);
          return (
            <a key={i} href={href || '#'} data-demo={href ? undefined : NOT_BUILT}
               className="group flex items-center gap-3 py-3.5 transition-colors hover:bg-porcelain">
              <span className="min-w-0 flex-1">
                <span className="block text-[15px] font-extrabold leading-tight text-mineshaft">{t.action.title}</span>
                {/* where this action actually lives, so the jump is never a surprise */}
                <span className="mt-1 block text-[12px] font-normal leading-tight text-dusty">
                  {t.mod.num}. {t.mod.label} <span className="text-silver">&rsaquo;</span> {t.sub.title}
                </span>
              </span>
              {Icon.arrow('h-4 w-4 shrink-0 text-silver group-hover:text-azure')}
            </a>
          );
        })}
      </div>
    </section>
  );
}

/* ================================= App =================================== */
function App() {
  // whatever the Values Flow has recorded so far; re-read on every visit
  const log = React.useMemo(loadLog, []);
  const current = React.useMemo(() => currentModule(log), [log]);
  const todo = React.useMemo(() => buildTodo(log), [log]);

  const stopSub = React.useMemo(() => stoppedAt(current, log), [current, log]);
  const [openId, setOpenId] = React.useState(current.id);  // the expanded section
  const [openSubId, setOpenSubId] = React.useState(stopSub ? stopSub.id : null);  // opens on where you left off
  const toggleModule = (id) => setOpenId((cur) => (cur === id ? null : id));
  const toggleSub = (id) => setOpenSubId((cur) => (cur === id ? null : id));

  return (
    <div className="mx-auto max-w-[1120px] px-4 py-8 sm:px-6 sm:py-10">
      {/* header */}
      <header className="mb-6">
        <div className="text-[13px] font-normal text-boulder">Training</div>
        <h1 className="mt-0.5 text-[26px] font-black leading-none text-mineshaft sm:text-[35px] sm:leading-[40px]">Your Campaign Pathways</h1>
      </header>

      {/* lessons carry the page; next actions ride shotgun on the right */}
      <div className="flex flex-col gap-5 lg:flex-row lg:items-start">
        <div className="min-w-0 flex-1">
          <ModulesList openId={openId} onToggle={toggleModule} openSubId={openSubId} onToggleSub={toggleSub}
                       log={log} current={current} />
        </div>
        {todo.length > 0 && (
          <aside className="w-full shrink-0 lg:sticky lg:top-6 lg:w-[320px]">
            <NextActions todo={todo} />
          </aside>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

    <p class="cpd-b"></p>
    <button class="cpd-x" type="button">Got it</button>

<script>(function(){
  var DEFAULT = 'This part of the prototype is not built yet.';
  var el = document.getElementById('cp-demo');
  var body = el.querySelector('.cpd-b');
  function show(msg){ body.textContent = msg || DEFAULT; el.classList.add('is-on'); }
  function hide(){ el.classList.remove('is-on'); }
  el.addEventListener('click', function(e){ if (e.target === el) hide(); });
  el.querySelector('.cpd-x').addEventListener('click', hide);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') hide(); });

  // Any anchor that goes nowhere (href="#", empty, or opted in with data-demo)
  // is a dead end in the prototype: say so instead of doing nothing.
  document.addEventListener('click', function(e){
    if (e.defaultPrevented) return;
    var a = e.target.closest && e.target.closest('a,[data-demo]');
    if (!a) return;
    if (a.closest('#cp-proto-nav') || a.closest('#cp-demo')) return;  // internal nav + this dialog
    var href = a.getAttribute('href');
    var dead = a.hasAttribute('data-demo') || !href || href === '' || href.charAt(0) === '#'
               || href.indexOf('javascript:') === 0;
    if (!dead) return;
    e.preventDefault();
    show(a.getAttribute('data-demo'));
  });
})();</script>
