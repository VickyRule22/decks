/* -------------------------------- progress ------------------------------
   Read from the SAME store the Values Flow writes, so the coach sees exactly
   what the prospect actually did. First visit seeds a realistic in-progress
   state (Section 1 partway, with a few actions skipped) so the demo has
   something to show; real activity in the flow overrides it. */
const STORE_LS = 'cp-values-flow-v3';
const DEFAULT_LOG = {
  'O-01': 'a', 'O-02': 'a', 'O-03': 'a',   // Getting started: answered
  'A-69': 'done', 'A-70': 'done',          // Family & personal decision: done
  'Q-03.1': 'yes',                         // Low-stakes volunteering: reached
  'A-61': 'done',                          // one action done; A-62 / A-64 / A-68 left open
};
function loadLog() {
  try {
    const raw = localStorage.getItem(STORE_LS);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  try { localStorage.setItem(STORE_LS, JSON.stringify(DEFAULT_LOG)); } catch (e) {}
  return { ...DEFAULT_LOG };
}

/* ------------------------------- helpers -------------------------------- */
/* Only Section 1 is built in the flow; its lessons map one-to-one onto the
   stops in the Values Flow, so a lesson opens that exact stop. */
const STOP_BY_SUB = {
  'exp-start':    'start',
  'exp-family':   'family',
  'exp-volly':    'volunteer',
  'exp-position': 'positioning',
  'exp-values':   'values',
};
function flowHref(sub) {
  const stop = sub && STOP_BY_SUB[sub.id];
  return stop ? `values-flow.html?stop=${stop}` : null;
}
// A single piece of content is linkable on its own, and opens exactly there.
function itemHref(sub, it) { return flowHref(sub) ? `values-flow.html?item=${it.id}` : null; }
// A section's link points at the first stop that actually exists inside it.
function moduleHref(m) {
  const first = m.subtopics.find((s) => flowHref(s));
  return first ? flowHref(first) : null;
}

function itemDone(it, log) {
  const v = log[it.id];
  if (it.type === 'action') return v === 'done';
  if (it.type === 'video')  return v === 'watched';
  return v !== undefined && v !== null && v !== '';
}
function itemSaved(it, log) { return it.type === 'action' && log[it.id] === 'saved'; }

/* A subsection holds items (Section 1) or is a bare lesson with one attached
   action (the shells). Both shapes answer the same questions. */
function subItems(s) {
  if (s.items) return s.items;
  return s.action ? [{ id: s.id + '-a', type: 'action', title: s.action.title }] : [];
}
function subStarted(s, log) { return subItems(s).some((i) => log[i.id] !== undefined); }
// An action only counts as open once she has actually reached it (or parked it).
function subOpenActions(s, log) {
  return subItems(s).filter((i) => i.type === 'action' && !itemDone(i, log)
                                   && (subStarted(s, log) || itemSaved(i, log)));
}

/* Time estimates are deliberately NOT shown anywhere: the team felt they
   discourage people. The per-item `mins` data stays for future use. */

function subComplete(s, log) {
  const its = subItems(s);
  return its.length > 0 && its.every((i) => itemDone(i, log));
}
function lessonsDone(m, log) { return m.subtopics.filter((s) => subComplete(s, log)).length; }
function openActions(m, log) { return m.subtopics.flatMap((s) => subOpenActions(s, log)); }
function moduleComplete(m, log) {
  return m.subtopics.length > 0 && lessonsDone(m, log) === m.subtopics.length && openActions(m, log).length === 0;
}

function moduleUnits(m) { return m.subtopics.reduce((n, s) => n + subItems(s).length, 0); }
function moduleUnitsDone(m, log) {
  return m.subtopics.reduce((n, s) => n + subItems(s).filter((i) => itemDone(i, log)).length, 0);
}
function moduleProgress(m, log) { const u = moduleUnits(m); return u ? moduleUnitsDone(m, log) / u : 0; }
// The lesson she stopped on: the first one not finished.
function stoppedAt(m, log) { return m.subtopics.find((s) => !subComplete(s, log)) || null; }
// Within a subsection, the first item not finished: the exact spot to resume.
function stoppedItem(s, log) { return subItems(s).find((i) => !itemDone(i, log)) || null; }
// Where she is in the pathway: the first section she has not finished.
function currentModule(log) { return MODULES.find((m) => !moduleComplete(m, log)) || MODULES[0]; }

function statusLine(m, log) {
  const total = m.subtopics.length, done = lessonsDone(m, log);
  if (done === 0 && !moduleUnitsDone(m, log)) {
    return `Not started · ${total} lessons`;
  }
  if (moduleComplete(m, log)) return `${done} of ${total} lessons · all actions done`;
  return `${done} of ${total} lessons done`;
}

// Everything she has reached but not finished, across the whole pathway. Only
// built sections can produce these, so every row deep-links to a real screen.
function buildTodo(log) {
  return MODULES.flatMap((m) =>
    m.subtopics.flatMap((s) => subOpenActions(s, log).map((a) => ({ mod: m, sub: s, action: a }))));
}

// Which subsection her questionnaire answers sit under: the first one that
// asks questions, so what she wrote lands right below the questions instead of
// dangling at the bottom of the section.
function questionnaireSubId(m) {
  const q = m.subtopics.find((s) => (s.items || []).some((i) => i.type === 'question'));
  return (q || m.subtopics[m.subtopics.length - 1] || {}).id;
}

function mapsHref(addr) {
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}`;
}

/* trailing run of their messages with nothing from the coach after it. */
function awaitingCount(messages) {
  let n = 0;
  for (let i = messages.length - 1; i >= 0 && messages[i].from === 'them'; i--) n++;
  return n;
}

/* Copies a shareable link to any section, subsection or action, so the coach
   can paste the exact spot into a text. */
function CopyLink({ href, label }) {
  const [copied, setCopied] = React.useState(false);
  const copy = (e) => {
    e.preventDefault();
    e.stopPropagation();
    const url = new URL(href, window.location.href).href;
    const flash = () => { setCopied(true); setTimeout(() => setCopied(false), 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(flash, flash);
    } else { flash(); }
  };
  return (
    <button type="button" onClick={copy}
            title={copied ? 'Copied to clipboard' : `Copy link to ${label}`}
            aria-label={copied ? 'Link copied to clipboard' : `Copy link to ${label}`}
            className={`relative z-30 inline-flex shrink-0 items-center gap-1 rounded p-1 text-[11px] font-extrabold transition ${copied ? 'text-appledark' : 'text-silver hover:text-azure'}`}>
      {copied ? Icon.check('h-4 w-4') : Icon.link('h-4 w-4')}
      {copied && <span>Copied</span>}
    </button>
  );
}

          const complete = moduleComplete(m, log);

          const stop = isCurrent ? stoppedAt(m, log) : null;
          const isOpen = openId === m.id;
          const qOwner = questionnaireSubId(m);
          return (
            <div key={m.id} className="overflow-hidden rounded-[9px] bg-white shadow-[0_0_6px_0_rgba(0,0,0,0.08)]">
              <div className="relative flex w-full items-center gap-3.5 overflow-hidden bg-white px-3.5 py-3 transition-colors hover:bg-porcelain">
                {/* faint periwinkle track, then an azure fill: blue is progress,
                    green stays reserved for completion. */}
                <span aria-hidden="true" className="pointer-events-none absolute inset-0" style={{ background: 'rgba(205,215,234,0.18)' }} />
                <span aria-hidden="true"
                      className="pointer-events-none absolute inset-y-0 left-0 transition-[width] duration-700"
                      style={{ width: (moduleProgress(m, log) * 100) + '%', background: 'linear-gradient(to right, rgba(58,95,173,0.20), rgba(88,115,250,0.10))' }} />
                <button onClick={() => onToggle(m.id)} aria-expanded={isOpen} aria-label={`${isOpen ? 'Collapse' : 'Expand'} ${m.label}`}
                        className="absolute inset-0 z-10" />
                <span className={`pointer-events-none relative z-20 grid h-11 w-11 shrink-0 place-items-center rounded-[9px] text-[12.5px] font-extrabold ${isCurrent ? 'bg-azure/10 text-azure' : 'bg-concrete text-boulder'}`}>{m.num}</span>
                <div className="pointer-events-none relative z-20 min-w-0 flex-1">
                  {isCurrent && <div className="text-[12px] font-extrabold leading-tight text-azure">Where she is now</div>}
                  <div className="text-[16px] font-extrabold leading-tight text-mineshaft">{m.label}</div>
                  <div className="mt-0.5 text-[11px] font-normal text-dusty">{statusLine(m, log)}</div>
                </div>
                {open > 0 && (
                  <span className="pointer-events-none relative z-20 shrink-0 rounded-full bg-warning/[0.12] px-2 py-1 text-[11px] font-extrabold text-warning">
                    {open} action{open > 1 ? 's' : ''} open
                  </span>
                )}
                {complete && (
                  <span className="pointer-events-none relative z-20 grid h-5 w-5 shrink-0 place-items-center rounded-full text-appledark ring-1 ring-appledark/50">{Icon.check('h-3 w-3')}</span>
                )}
                {moduleHref(m) && <CopyLink href={moduleHref(m)} label={m.label} />}
                <span className={`pointer-events-none relative z-20 shrink-0 ${isOpen ? 'rotate-180 text-azure' : 'text-silver'}`}>{Icon.chevronDown('h-4 w-4')}</span>
              </div>

              {isOpen && (
                <div className="border-t border-mercury bg-porcelain/60 px-3 py-2.5 fade-in">
                  {m.insight && (
                    <p className="mb-3 border-l border-azure/40 py-0.5 pl-4 font-lato text-[15px] leading-relaxed text-boulder">{m.insight}</p>
                  )}
                  <div className="space-y-1">
                    {m.subtopics.map((s, i) => {
                      const watched = subComplete(s, log);
                      const isStop = !!stop && s.id === stop.id;
                      const href = flowHref(s);
                      const open = subOpenActions(s, log).length;
                      const done = subComplete(s, log);

                      /* A built subsection opens a second caret onto its items. */
                      if (s.items) {
                        const isSubOpen = openSubId === s.id;
                        const stopIt = isStop ? stoppedItem(s, log) : null;
                        return (
                          <React.Fragment key={s.id}>
                          <div className={`rounded-[9px] bg-white ${isStop ? 'ring-1 ring-azure/50' : ''}`}>
                            <div className={`relative flex w-full items-center gap-3 rounded-[9px] px-2.5 py-2.5 transition-colors ${isStop ? 'bg-azure/[0.06] hover:bg-azure/[0.10]' : 'hover:bg-porcelain'}`}>
                              <button onClick={() => onToggleSub(s.id)} aria-expanded={isSubOpen}
                                      aria-label={`${isSubOpen ? 'Collapse' : 'Expand'} ${s.title}`}
                                      className="absolute inset-0 z-10 rounded-[9px]" />
                              <span className={`pointer-events-none relative z-20 shrink-0 ${isStop ? 'grid h-6 w-6 place-items-center rounded-full bg-azure text-[11px] font-extrabold text-white' : 'w-4 text-[12px] font-normal text-dusty'}`}>{i + 1}</span>
                              <span className="pointer-events-none relative z-20 min-w-0 flex-1">
                                {isStop && <span className="block text-[10.5px] font-extrabold uppercase tracking-wide text-azure">Current focus</span>}
                                <span className={`block text-[13.5px] font-extrabold leading-tight ${isStop ? 'text-azure' : done ? 'text-boulder' : 'text-mineshaft'}`}>{s.title}</span>
                                {subItems(s).length > 0 && (
                                  <span className="mt-0.5 block text-[11.5px] font-normal text-dusty">
                                    {subItems(s).length} items
                                  </span>
                                )}
                              </span>
                              {open > 0
                                ? <span className="pointer-events-none relative z-20 shrink-0 rounded-full bg-warning/[0.12] px-2 py-0.5 text-[11px] font-extrabold text-warning">{open} action{open > 1 ? 's' : ''} open</span>
                                : done
                                  ? <span className="pointer-events-none relative z-20 grid h-5 w-5 shrink-0 place-items-center rounded-full text-appledark ring-1 ring-appledark/50">{Icon.check('h-3 w-3')}</span>
                                  : null}
                              {href && <CopyLink href={href} label={s.title} />}
                              <span className={`pointer-events-none relative z-20 shrink-0 ${isSubOpen ? 'rotate-180 text-azure' : 'text-silver'}`}>{Icon.chevronDown('h-4 w-4')}</span>
                            </div>
                            {isSubOpen && (
                              <div className="space-y-0.5 border-t border-mercury px-2.5 py-2">
                                {s.items.map((it) => {
                                  const ih = itemHref(s, it);
                                  const itDone = itemDone(it, log);
                                  const isItemStop = stopIt && it.id === stopIt.id;
                                  return (
                                    <div key={it.id} className={`group flex items-center gap-2.5 rounded-[9px] px-2 py-2 transition-colors ${isItemStop ? 'bg-azure/[0.09]' : 'hover:bg-porcelain'}`}>
                                      <a href={ih || '#'} data-demo={ih ? undefined : NOT_BUILT}
                                         className="flex min-w-0 flex-1 items-center gap-2.5">
                                        <span className={`shrink-0 ${itDone ? 'text-appledark' : 'text-azure'}`}>
                                          {ITEM_ICON[it.type](' h-4 w-4')}
                                        </span>
                                        <span className="min-w-0 flex-1">
                                          {isItemStop && <span className="block text-[10px] font-extrabold uppercase tracking-wide text-azure">Next action</span>}
                                          <span className={`block text-[13px] leading-tight ${isItemStop ? 'font-extrabold text-azure' : itDone ? 'font-normal text-boulder' : 'font-extrabold text-mineshaft'}`}>{it.title}</span>
                                          <span className="mt-0.5 block text-[11px] font-normal text-dusty">
                                            {ITEM_LABEL[it.type]}
                                          </span>
                                        </span>
                                      </a>
                                      {ih && <CopyLink href={ih} label={it.title} />}
                                      {itDone
                                        ? <span className="grid h-5 w-5 shrink-0 place-items-center rounded-full text-appledark ring-1 ring-appledark/50">{Icon.check('h-3 w-3')}</span>
                                        : Icon.arrow('h-4 w-4 shrink-0 text-silver group-hover:text-azure')}
                                    </div>
                                  );
                                })}
                              </div>
                            )}
                          </div>
                          {m.questionnaire && s.id === qOwner && <QuestionnaireAnswers q={m.questionnaire} />}
                          </React.Fragment>
                        );
                      }

                      return (
                        <React.Fragment key={s.id}>
                        <a href={href || '#'} data-demo={href ? undefined : NOT_BUILT}
                           className={`group flex items-center gap-3 rounded-[9px] px-2.5 py-2.5 transition-colors ${isStop ? 'bg-azure/[0.08]' : 'hover:bg-white'}`}>
                          <span className="w-4 shrink-0 text-[12px] font-normal text-dusty">{i + 1}</span>
                          <span className="min-w-0 flex-1">
                            <span className={`block text-[13.5px] leading-tight ${isStop ? 'font-extrabold text-azure' : watched ? 'font-normal text-boulder' : 'font-normal text-mineshaft'}`}>{s.title}</span>
                            {isStop && <span className="mt-0.5 block text-[11.5px] font-normal text-azure/80">Current focus</span>}
                          </span>
                          {watched
                            ? <span className="grid h-5 w-5 shrink-0 place-items-center rounded-full text-appledark ring-1 ring-appledark/50">{Icon.check('h-3 w-3')}</span>
                            : Icon.arrow('h-4 w-4 shrink-0 text-silver group-hover:text-azure')}
                        </a>
                        {m.questionnaire && s.id === qOwner && <QuestionnaireAnswers q={m.questionnaire} />}
                        </React.Fragment>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </section>
  );
}

/* ============================ Status chip ===============================
   Same language as the coach home roster: Active (green) vs Stalled (a calm
   gray, not an alarm). A cooling pace reads as Stalled; the pace detail below
   keeps the "down from 4" context. */
function MomentumChip({ m }) {
  const stalled = m.trend === 'down';
  const look = stalled
    ? { label: 'Stalled', chip: 'bg-concrete text-boulder', icon: Icon.clock }
    : { label: 'Active',  chip: 'bg-apple/10 text-apple',   icon: Icon.spark };
  return (
    <div className="text-right">
      <span className={`inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[12px] font-extrabold ${look.chip}`}>
        {look.icon('h-3.5 w-3.5')}{look.label}
      </span>
      <div className="mt-1 text-[11px] font-normal text-boulder">{m.recent} lesson{m.recent === 1 ? '' : 's'} in {m.window}, {m.trend === 'down' ? 'down' : 'up'} from {m.prior}</div>
    </div>
  );
}

/* ========================================================================
   CONTEXT ZONE (left rail): Coach Notes, Elections, About/Bio.
   Everything here reads from the shared model in profile-data.js, which
   carries owner + visibility on every field. This is the coach view, so
   ROLE = 'coach'; the future prospect view sets 'prospect' and the same
   visibleTo / editableBy checks (plus simply not rendering the coach-only
   components) do the filtering.
   ======================================================================== */
const { PROFILE, config: PROFILE_CONFIG, ELECTION_STATUSES, electionStatus,
        deriveEligibleOffices, visibleTo, editableBy } = window.CP_PROFILE;
const ROLE = 'coach';

/* Coach-owned edits (notes, election statuses) persist locally, overlaid
   on the seed values from the model. */
const COACH_LS = 'cp-coach-profile-v1';
function loadCoachStore() {
  try { return JSON.parse(localStorage.getItem(COACH_LS)) || {}; } catch (e) { return {}; }
}
function saveCoachStore(s) { try { localStorage.setItem(COACH_LS, JSON.stringify(s)); } catch (e) {} }

/* ------------------------- shared field row ----------------------------- */
/* Read-only rendering for prospect-owned fields. Arrays render as pills. */
function FieldValue({ f, quiet }) {
  if (f.value === null || f.value === undefined || f.value === '') {
    return <span className="text-[12.5px] font-normal italic text-dusty">Prefer not to say</span>;
  }
  if (Array.isArray(f.value)) {
    return (
      <span className="flex flex-wrap gap-1.5">
        {f.value.map((v) => (
          <span key={v} className="rounded-full bg-concrete px-2.5 py-0.5 text-[11.5px] font-extrabold text-boulder">{v}</span>
        ))}
      </span>
    );
  }
  return <span className={`text-[12.5px] leading-snug ${quiet ? 'font-normal text-boulder' : 'font-extrabold text-mineshaft'}`}>{f.value}</span>;
}

function FieldRow({ f, quiet }) {
  return (
    <div className="py-1.5">
      <div className="text-[10.5px] font-extrabold uppercase tracking-[0.1em] text-dusty">{f.label}</div>
      <div className="mt-0.5"><FieldValue f={f} quiet={quiet} /></div>
      {quiet && f.why && (
        <div className="mt-0.5 text-[10.5px] font-normal leading-snug text-silver">Why we ask: {f.why}</div>
      )}
    </div>
  );
}

/* Note-date helpers: parse 'YYYY-MM-DD' without timezone drift, and stamp
   today's local date on a new entry. */
function fmtNoteDate(ts) {
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(ts || '');
  if (!m) return '';
  return MON[+m[2] - 1] + ' ' + (+m[3]) + ', ' + m[1];
}
function todayISO() {
  var d = new Date(), p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

/* ============================ 1. Coach notes =============================
   Coach-owned, coach-only. A reverse-chronological SESSION LOG rather than one
   growing field: quick-add on top, newest entry expanded, older entries
   collapsed to a single line. The list is height-bounded and scrolls
   internally, so a coach who writes pages over many sessions never pushes the
   rest of the context rail off screen, and a coach who writes one line still
   just types and adds. The prospect view never renders this component. */
function NoteEntry({ entry, defaultOpen, onDelete }) {
  const [open, setOpen] = React.useState(defaultOpen);
  return (
    <div className="py-2.5">
      <button type="button" onClick={() => setOpen(!open)} aria-expanded={open}
              className="flex w-full items-center gap-1.5 text-left">
        <span className={`shrink-0 text-silver transition-transform ${open ? 'rotate-180' : ''}`}>{Icon.chevronDown('h-3.5 w-3.5')}</span>
        <span className="shrink-0 text-[10.5px] font-extrabold uppercase tracking-[0.08em] text-dusty">{fmtNoteDate(entry.ts)}</span>
        {!open && <span className="min-w-0 flex-1 truncate text-[12.5px] font-normal text-boulder">{entry.text}</span>}
      </button>
      {open && (
        <div className="mt-1 pl-5">
          <p className="font-lato text-[13px] leading-relaxed text-mineshaft">{entry.text}</p>
          <button type="button" onClick={() => onDelete(entry.id)}
                  className="mt-1 text-[10.5px] font-extrabold uppercase tracking-[0.06em] text-silver transition hover:text-warning">Delete</button>
        </div>
      )}
    </div>
  );
}

function CoachNotesCard({ entries, onAdd, onDelete }) {
  const [draft, setDraft] = React.useState('');
  const add = () => { const t = draft.trim(); if (!t) return; onAdd(t); setDraft(''); };
  return (
    <section className="rounded-[9px] bg-white p-4 shadow-[0_0_6px_0_rgba(0,0,0,0.08)] fade-in">
      <div className="flex items-center gap-2 border-b border-mercury pb-2.5">
        <span className="text-boulder">{Icon.lock('h-4 w-4')}</span>
        <div className="min-w-0 flex-1">
          <h2 className="text-[15px] font-extrabold leading-tight text-mineshaft">Coach notes</h2>
          <div className="text-[11px] font-normal text-dusty">Only visible to coaches. Never shown to the prospect.</div>
        </div>
      </div>

      {/* quick-add: type a note and add it as today's entry */}
      <div className="mt-2.5">
        <textarea
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          rows={3}
          placeholder="Add a note after your session…"
          className="w-full resize-y rounded-[9px] border border-mercury bg-porcelain/60 p-3 font-lato text-[13.5px] leading-relaxed text-mineshaft placeholder:text-silver focus:border-azure/50 focus:outline-none" />
        <div className="mt-1.5 flex items-center justify-between">
          <span className="text-[10.5px] font-normal text-silver">Newest note shows first.</span>
          <button type="button" onClick={add} disabled={!draft.trim()}
                  className="inline-flex items-center gap-1.5 rounded-full bg-azure px-3 py-1.5 text-[11.5px] font-extrabold text-white transition hover:brightness-95 disabled:cursor-not-allowed disabled:opacity-40">
            Add note
          </button>
        </div>
      </div>

      {/* session log: newest expanded, older collapsed; bounded + scrolls */}
      <div className="mt-1.5 border-t border-concrete">
        {entries.length === 0 ? (
          <p className="py-3 text-[12px] font-normal italic text-dusty">No notes yet. Add one after your next session.</p>
        ) : (
          <div className="max-h-[300px] divide-y divide-concrete overflow-y-auto">
            {entries.map((e, i) => (
              <NoteEntry key={e.id} entry={e} defaultOpen={i === 0} onDelete={onDelete} />
            ))}
          </div>
        )}
      </div>
    </section>
  );
}

/* ====================== 2. Elections eligibility =========================
   Offices are DERIVED from the civic-footprint districts (single source of
   truth); only the coach's status per office is stored. The chip is a
   first-class status object so the same states can filter the prospect

function StatusChip({ statusId, editable, onChange }) {

    return (
      <span className={`inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[11px] font-extrabold ${s.chip}`}>
        <span className="h-1.5 w-1.5 rounded-full" style={{ background: s.dot }} />{s.label}
      </span>
    );

  return (
    <div className="relative shrink-0">
      <button type="button" onClick={() => setOpen(!open)} aria-haspopup="listbox" aria-expanded={open}
              className={`inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[11px] font-extrabold transition hover:brightness-95 ${s.chip}`}>
        <span className="h-1.5 w-1.5 rounded-full" style={{ background: s.dot }} />
        {s.label}
        {Icon.chevronDown('h-3 w-3')}

      {open && (

                <span className="h-1.5 w-1.5 shrink-0 rounded-full" style={{ background: opt.dot }} />
                <span className="flex-1">{opt.label}</span>

        </React.Fragment>
      )}
    </div>
  );
}

/* ============================ 3. About / Bio =============================
   Three deliberately separate sub-sections: professional (most weight),
   civic footprint (powers Elections), and self-identified demographics
   (prospect-private: collapsed, quiet, coach can never edit). */
function BioCard() {
  const [demoOpen, setDemoOpen] = React.useState(false);   // collapsed by default
  const pro = PROFILE.professional.filter((f) => visibleTo(f, ROLE));
  const civic = PROFILE.civic.filter((f) => visibleTo(f, ROLE));
  const demo = PROFILE.demographics.filter((f) => visibleTo(f, ROLE));
  const experience = pro.find((f) => f.id === 'experience');
  const proRest = pro.filter((f) => f.id !== 'experience');
  const bio = PROFILE.bio;
  const showBio = bio && visibleTo(bio, ROLE);
  const hasBio = showBio && typeof bio.value === 'string' && bio.value.trim() !== '';
  return (
    <section className="rounded-[9px] bg-white p-4 shadow-[0_0_6px_0_rgba(0,0,0,0.08)] fade-in">
      <div className="border-b border-mercury pb-2.5">
        <h2 className="text-[15px] font-extrabold leading-tight text-mineshaft">About</h2>
        <div className="text-[11px] font-normal text-dusty">Provided by the prospect · read-only for coaches</div>
      </div>

      {/* a. Bio: the prospect's own words. Leads the card as the warmest,
            least-structured context; empty-safe so a skipped bio is quiet. */}
      {showBio && (
        <div className="pt-3">
          <div className="text-[10.5px] font-extrabold uppercase tracking-[0.14em] text-azure">In her words</div>
          {hasBio ? (
            <p className="mt-1.5 font-lato text-[13.5px] leading-relaxed text-mineshaft">{bio.value}</p>

            <p className="mt-1.5 font-lato text-[12.5px] italic leading-relaxed text-dusty">She hasn't added a bio yet.</p>

      {/* b. Professional / qualifications: the most visual weight */}
      <div className={showBio ? 'mt-3 border-t border-concrete pt-3' : 'pt-3'}>
        <div className="text-[10.5px] font-extrabold uppercase tracking-[0.14em] text-azure">Professional</div>

          <p className="mt-1.5 font-lato text-[13.5px] leading-relaxed text-mineshaft">{experience.value}</p>

          {proRest.map((f) => <FieldRow key={f.id} f={f} />)}

      {/* b. Civic footprint: single source of truth for the districts that

      <div className="mt-3 border-t border-concrete pt-3">
        <div className="text-[10.5px] font-extrabold uppercase tracking-[0.14em] text-azure">Civic footprint</div>
        <div className="grid grid-cols-1 gap-x-4 sm:grid-cols-2">

        <div className="mt-1 text-[10.5px] font-normal text-silver">These districts determine the eligible offices in Elections.</div>

      {/* c. Self-identified demographics: prospect-private. Collapsed by
            default, visually quiet, never editable by the coach. */}
      <div className="mt-3 border-t border-concrete pt-2">
        <button type="button" onClick={() => setDemoOpen(!demoOpen)} aria-expanded={demoOpen}
                className="flex w-full items-center gap-2 py-1 text-left">
          <span className="flex-1 text-[12px] font-extrabold text-boulder">Self-identified information</span>
          <span className={`text-silver transition-transform ${demoOpen ? 'rotate-180' : ''}`}>{Icon.chevronDown('h-4 w-4')}</span>
        </button>
        {demoOpen && (
          <div className="pb-1">
            <div className="text-[10.5px] font-normal leading-snug text-silver">
              Shared by the prospect, in her own words. Only she can edit these.
            </div>
            {demo.map((f) => <FieldRow key={f.id} f={f} quiet />)}
          </div>
        )}
      </div>
    </section>
  );
}

/* ========================== PDF export sheet =============================
   "Export PDF" runs the browser's print-to-PDF over this sheet (portal into
   <body>; the app shell is hidden in print CSS). Demographics are included
   only when config.includeDemographicsInExport is true (default false). */
function PrintSheet({ p, offices, statusMap, notesLog }) {
  const rows = (fields) => fields.map((f) => (
    <tr key={f.id}>
      <td className="ps-label">{f.label}</td>
      <td>{f.value === null || f.value === undefined || f.value === ''
            ? 'Prefer not to say'
            : Array.isArray(f.value) ? f.value.join(', ') : f.value}</td>
    </tr>
  ));
  return ReactDOM.createPortal(
    <div className="print-sheet" aria-hidden="true">
      <h1>{p.name}</h1>
      <div className="ps-meta">Prospect profile · {p.address} · {p.email} · {p.phone}</div>
      <div className="ps-meta">Internal coach copy. Coach notes and election statuses are coach-only.</div>

      {PROFILE.bio && visibleTo(PROFILE.bio, ROLE) && typeof PROFILE.bio.value === 'string' && PROFILE.bio.value.trim() !== '' && (
        <React.Fragment>
          <h2>Bio</h2>
          <p>{PROFILE.bio.value}</p>
        </React.Fragment>
      )}

      <h2>Coach notes</h2>
      {notesLog.length === 0 ? (
        <p>No notes yet.</p>
      ) : (
        <table><tbody>
          {notesLog.map((e) => (
            <tr key={e.id}><td className="ps-label">{fmtNoteDate(e.ts)}</td><td>{e.text}</td></tr>
          ))}
        </tbody></table>
      )}

      <h2>Elections</h2>
      <table><tbody>
        {offices.map((o) => (
          <tr key={o.id}>
            <td className="ps-label">{o.office}</td>
            <td>{o.district} · next election {o.nextElection} · {o.filing} · status: {electionStatus(statusMap[o.id] || 'not_asked').label}</td>
          </tr>
        ))}
      </tbody></table>

      <h2>Professional</h2>
      <table><tbody>{rows(PROFILE.professional)}</tbody></table>

      <h2>Civic footprint</h2>
      <table><tbody>{rows(PROFILE.civic)}</tbody></table>

      {PROFILE_CONFIG.includeDemographicsInExport && (
        <React.Fragment>
          <h2>Self-identified information</h2>
          <table><tbody>{rows(PROFILE.demographics)}</tbody></table>
        </React.Fragment>
      )}
    </div>,
    document.body
  );
}

/* ======================= Profile header (prospect) ====================== */

    <header className="mb-5 rounded-[9px] bg-white p-4 shadow-[0_0_6px_0_rgba(0,0,0,0.08)] sm:p-5">
      <div className="flex flex-wrap items-start gap-4">
        <div className="grid h-14 w-14 shrink-0 place-items-center rounded-full bg-concrete text-lg font-extrabold text-boulder">
          {p.monogram}
        </div>
        <div className="min-w-0 flex-1">
          <div className="text-[11px] font-extrabold uppercase tracking-[0.14em] text-dusty">Prospect profile</div>
          <h1 className="mt-0.5 text-[26px] font-extrabold leading-none text-mineshaft sm:text-[30px]">{p.name}</h1>
          <div className="mt-1.5 flex flex-wrap items-center gap-x-1.5 text-[12px] font-normal text-boulder">
            <span>{p.type}</span>
            <span className="text-silver">·</span>
            <span className="inline-flex items-center gap-1">{Icon.clock('h-3.5 w-3.5 text-dusty')}Last active {p.lastActiveLabel}</span>
          </div>
        </div>

            pinned to the right edge, deliberately lighter than the name */}
        <div className="flex flex-col items-end gap-2">
          <button type="button" onClick={() => window.print()}
                  title="Download this profile as a PDF"
                  className="inline-flex items-center gap-1.5 rounded-full border border-alto bg-white px-3 py-1.5 text-[11.5px] font-extrabold text-boulder transition hover:border-azure/40 hover:text-azure">
            {Icon.download('h-3.5 w-3.5')} Export PDF

        <a href={mapsHref(p.address)} target="_blank" rel="noopener"

/* ================================= App ===================================
   Two zones under the full-width header:
     - CONTEXT (left, sticky, ~1/3): Coach Notes, Elections, About/Bio.
     - PATHWAY (right): Next actions + the untouched module tree.
   Narrow viewports collapse to one column, Context above Pathway. */
function App() {
  const log = React.useMemo(loadLog, []);
  const current = React.useMemo(() => currentModule(log), [log]);
  const todo = React.useMemo(() => buildTodo(log), [log]);
  const stopSub = React.useMemo(() => stoppedAt(current, log), [current, log]);

  const [openId, setOpenId] = React.useState(current.id);
  const [openSubId, setOpenSubId] = React.useState(stopSub ? stopSub.id : null);
  const toggleModule = (id) => setOpenId((cur) => (cur === id ? null : id));
  const toggleSub = (id) => setOpenSubId((cur) => (cur === id ? null : id));
  const awaiting = awaitingCount(SEED_MESSAGES);

  /* coach-owned edits: seed values from the model, local saves on top */
  const [coach, setCoach] = React.useState(loadCoachStore);
  const patchCoach = (patch) => setCoach((cur) => { const next = { ...cur, ...patch }; saveCoachStore(next); return next; });
  const notesLog = coach.notesLog !== undefined ? coach.notesLog : PROFILE.coach.notesLog;
  const addNote = (text) => patchCoach({ notesLog: [{ id: 'note-' + Date.now(), ts: todayISO(), text: text }, ...notesLog] });
  const deleteNote = (id) => patchCoach({ notesLog: notesLog.filter((e) => e.id !== id) });
  const statusMap = { ...PROFILE.coach.electionStatus.value, ...(coach.electionStatus || {}) };
  const setStatus = (officeId, sid) => patchCoach({ electionStatus: { ...(coach.electionStatus || {}), [officeId]: sid } });
  const offices = React.useMemo(() => deriveEligibleOffices(PROFILE), []);

  return (
    <div className="mx-auto max-w-[1180px] px-4 py-8 sm:px-6 sm:py-10">
      <ProfileHeader p={PROSPECT} />

      <div className="mt-5 space-y-4">
        <MessageNotification count={awaiting} />

        <div className="flex flex-col gap-4 lg:flex-row lg:items-start">
          {/* CONTEXT zone */}
          <aside className="w-full shrink-0 space-y-4 lg:sticky lg:top-5 lg:max-h-[calc(100vh-120px)] lg:w-[360px] lg:overflow-y-auto">
            <CoachNotesCard entries={notesLog} onAdd={addNote} onDelete={deleteNote} />
            <ElectionsCard offices={offices} statusMap={statusMap} onStatus={setStatus} />
            <BioCard />
          </aside>

          {/* PATHWAY zone: unchanged actions + module tree */}
          <div className="min-w-0 flex-1 space-y-4">
            <NextActions todo={todo} />
            <ModulesList openId={openId} onToggle={toggleModule} openSubId={openSubId} onToggleSub={toggleSub}
                         log={log} current={current} />
          </div>
        </div>
      </div>

      <PrintSheet p={PROSPECT} offices={offices} statusMap={statusMap} notesLog={notesLog} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

    <div class="cpd-t" id="cp-demo-title">Just a demo</div>
    <p class="cpd-b"></p>
    <button class="cpd-x" type="button">Got it</button>
  </div>
</div>
<script>(function(){
  var DEFAULT = 'This part of the prototype is not built yet.';
  var el = document.getElementById('cp-demo');
  var body = el.querySelector('.cpd-b');
  function show(msg){ body.textContent = msg || DEFAULT; el.classList.add('is-on'); }
  function hide(){ el.classList.remove('is-on'); }
  el.addEventListener('click', function(e){ if (e.target === el) hide(); });
  el.querySelector('.cpd-x').addEventListener('click', hide);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') hide(); });

  // Any anchor that goes nowhere (href="#", empty, or opted in with data-demo)
  // is a dead end in the prototype: say so instead of doing nothing.
  document.addEventListener('click', function(e){
    if (e.defaultPrevented) return;
    var a = e.target.closest && e.target.closest('a,[data-demo]');
    if (!a) return;
    if (a.closest('#cp-proto-nav') || a.closest('#cp-demo')) return;  // internal nav + this dialog
    var href = a.getAttribute('href');
    var dead = a.hasAttribute('data-demo') || !href || href === '' || href.charAt(0) === '#'
               || href.indexOf('javascript:') === 0;
    if (!dead) return;
    e.preventDefault();
    show(a.getAttribute('data-demo'));
  });
})();</script>
