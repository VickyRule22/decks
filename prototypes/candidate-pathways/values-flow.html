/* Stream a string in, character by character (the AI "typing" effect). */
function useStream(text, on, speed = 9, chunk = 3){
  const [out, setOut] = useState(''); const [running, setRunning] = useState(false);
  useEffect(() => {
    if (!on) { setOut(''); setRunning(false); return; }
    setOut(''); setRunning(true);
    let i = 0;
    const t = setInterval(() => { i += chunk; setOut(text.slice(0, i)); if (i >= text.length) { clearInterval(t); setRunning(false); } }, speed);
    return () => clearInterval(t);
  }, [text, on]);
  return [out, running];
}

function itemKind(it){ return it.type === 'course' ? 'video' : it.type === 'action' ? 'action' : 'question'; }

/* time estimates: per item, and rolled up to the stop you are on */
function fmtMins(n){
  if (!n) return '';
  if (n < 60) return `${n} min`;
  const h = Math.floor(n / 60), m = n % 60;
  return m ? `${h} hr ${m} min` : `${h} hr`;
}
function stageMinsLeft(stage, log){
  return stage.items.reduce((n, it) => n + (isResolved(it, log) ? 0 : (it.mins || 0)), 0);
}
/* Resolved = answered / watched / done. A saved action is NOT resolved. */
function isResolved(it, log){
  const v = log[it.id];
  if (it.type === 'action') return v === 'done';
  if (it.type === 'course') return v === 'watched';
  return v !== undefined && v !== '' && v !== null;
}

function CourseScreen({ item, value, onRecord }) {
  const watched = value === 'watched';
  const [playing, setPlaying] = useState(false);
  const [prog, setProg] = useState(watched ? 1 : 0);
  const timer = useRef(null);
  const toggle = () => {
    if (watched) return;
    if (playing) { clearInterval(timer.current); setPlaying(false); return; }
    const DURATION = 2600; const t0 = performance.now() - prog * DURATION;
    setPlaying(true);
    timer.current = setInterval(() => {
      const nx = Math.min(1, (performance.now() - t0) / DURATION);
      setProg(nx);
      if (nx >= 1) { clearInterval(timer.current); setPlaying(false); onRecord('watched'); }
    }, 30);
  };
  useEffect(() => () => clearInterval(timer.current), []);
  return (
    <div>
      <h1 className={heading}>{item.title}</h1>
      <button onClick={toggle} className="group relative mt-7 block aspect-video w-full overflow-hidden rounded-2xl ring-1 ring-mercury">
        <div className="absolute inset-0 bg-concrete" />
        <div className="absolute inset-0 grid place-items-center text-mineshaft/30"><span className="scale-[2.4] opacity-40">{I.film}</span></div>
        <div className={`absolute right-4 top-4 rounded px-2 py-1 text-[11px] font-extrabold tabular-nums ${watched ? 'bg-appledark text-white' : 'bg-black/50 text-white'}`}>{watched ? 'Watched' : fmtMins(item.mins)}</div>
        <div className="absolute inset-0 grid place-items-center">
          <span className={`grid h-16 w-16 place-items-center rounded-full ${watched ? 'bg-appledark text-white' : 'bg-white text-mineshaft'}`}>
            {playing ? <span className="text-base font-extrabold tracking-tighter">II</span> : watched ? <span>{I.check}</span> : <span className="ml-0.5">{I.play}</span>}
          </span>
        </div>
        <div className="absolute inset-x-0 bottom-0 bg-black/40 px-4 pb-3 pt-10">
          <div className="h-1 overflow-hidden rounded-full bg-white/25"><div className="h-full rounded-full bg-[linear-gradient(to_right,#3A5FAD,#5873FA)]" style={{ width:`${prog*100}%`, transition:'none' }} /></div>
        </div>
      </button>
    </div>
  );
}

function ActionScreen({ item, value, onRecord }) {
  const help = ACTION_HELP[item.id];
  const [open, setOpen] = useState(false);
  const [draft, running] = useStream(help ? help.draft : '', open, 9, 3);
  useEffect(() => { setOpen(false); }, [item.id]);
  const done = value === 'done';
  const saved = value === 'saved';
  return (
    <div>
      <h1 className={heading}>{item.title}</h1>

      {done && <p className="mt-4 inline-flex items-center gap-2 text-[15px] font-extrabold text-appledark">{I.check} Done</p>}
      {saved && !done && <p className="mt-4 inline-flex items-center gap-2 text-[15px] font-extrabold text-warning">{I.bookmark} Saved &middot; reminder in 5 days</p>}

      {open && help && (
        <div className="cp-card mt-6">
          <div className="flex items-center justify-between border-b border-mercury px-4 py-2.5">
            <div className="flex items-center gap-1.5 text-[11px] font-extrabold text-bpurple">
              <span className="scale-90">{I.sparkles}</span> {running ? 'Generating your script' : 'Draft ready'}
            </div>
            <button className="flex items-center gap-1 text-[11px] font-normal text-dusty transition hover:text-mineshaft"><span className="scale-90">{I.copy}</span> Copy</button>
          </div>
          <pre className="max-h-[40vh] overflow-y-auto whitespace-pre-wrap px-4 py-4 font-sans text-[14px] leading-relaxed text-mineshaft">
            {draft}{running && <span className="ml-0.5 inline-block h-4 w-1.5 -translate-y-px bg-bpurple align-middle" />}
          </pre>
        </div>
      )}

      {!done && (
        <div className="mt-8 flex flex-wrap items-center gap-3">
          {!open ? (
            <>
              {help && <PrimaryBtn onClick={()=>setOpen(true)}><span className="scale-90">{I.sparkles}</span> Do it now</PrimaryBtn>}
              {!help && <PrimaryBtn onClick={()=>onRecord('done')}>{I.check} Mark done</PrimaryBtn>}
              {!saved && <GhostBtn onClick={()=>onRecord('saved')}>{I.bookmark} Save for later</GhostBtn>}
            </>
          ) : (
            <>
              <PrimaryBtn onClick={()=>onRecord('done')}>{I.check} I did it</PrimaryBtn>
              {!saved && <GhostBtn onClick={()=>onRecord('saved')}>{I.bookmark} Save for later</GhostBtn>}
            </>
          )}
        </div>
      )}
    </div>
  );
}

function DoneScreen({ log, onExit, onRestart }) {
  const total = ITEMS.length;
  const captured = ITEMS.filter((e) => isResolved(e.item, log) || log[e.item.id] === 'saved').length;
  return (
    <div className="text-center">
      <span className="mx-auto grid h-20 w-20 place-items-center rounded-full bg-azure text-white"><span className="scale-125">{I.rocket}</span></span>
      <h1 className="mt-6 text-[32px] font-black text-mineshaft">Know Your Values complete.</h1>
      <p className="mx-auto mt-3 max-w-md text-[15px] leading-relaxed text-boulder">You worked through all {total} steps and captured {captured}.</p>
      <div className="mt-8 flex justify-center gap-3">
        <PrimaryBtn onClick={onExit}>Back to my pathway {I.arrowRight}</PrimaryBtn>
        <GhostBtn onClick={onRestart}>Run it again</GhostBtn>
      </div>
    </div>
  );
}

/* -------------------------- the trail (left rail) ----------------------- */
function Rail({ stage, stageItems, idx, log, onJump }) {
  return (
    <aside className="hidden w-[320px] shrink-0 overflow-y-auto border-r border-mercury bg-white px-3 py-5 md:block">
      <div className="space-y-1.5">
        {stageItems.map(({ item, gi }) => {
          const kind = itemKind(item);
          const current = gi === idx;
          const resolved = isResolved(item, log);
          const saved = item.type === 'action' && log[item.id] === 'saved';
          /* what it is; a saved action says so. No time estimates anywhere:
             the team felt they discourage people. */
          const sub = kind === 'action'
                    ? (log[item.id] === 'done' ? 'Action · done'
                       : saved ? 'Action · saved, reminder in 5 days'
                       : 'Action')
                    : kind === 'video' ? 'Video' : 'Question';
          return (
            <button key={item.id} onClick={()=>onJump(gi)}
              className={`flex w-full items-start gap-3 rounded-xl px-3 py-3 text-left transition ${
                current ? 'bg-azure/[0.08] ring-1 ring-azure/30' : 'hover:bg-porcelain'}`}>
              <span className={`mt-0.5 grid h-6 w-6 shrink-0 place-items-center rounded-full border ${
                resolved ? 'border-appledark bg-appledark text-white' : current ? 'border-azure' : 'border-alto'}`}>
                {resolved ? <Icon d={<path d="M20 6 9 17l-5-5" />} size={13} /> : current ? <span className="h-2 w-2 rounded-full bg-azure" /> : <span className="h-1.5 w-1.5 rounded-full bg-silver" />}
              </span>
              <span className="min-w-0 flex-1">
                <span className={`block text-[14.5px] font-extrabold leading-snug ${current ? 'text-azure' : 'text-mineshaft'}`}>{item.title}</span>
                <span className={`mt-0.5 block text-[12px] font-normal ${saved ? 'text-warning' : 'text-dusty'}`}>{sub}</span>
              </span>
              {item.type === 'action' && (
                <span className={`mt-0.5 shrink-0 ${saved ? 'text-warning' : 'text-silver'}`}>
                  <Icon d={<path d="m19 21-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />} size={16} />
                </span>
              )}
            </button>
          );
        })}
      </div>
    </aside>
  );
}

/* --------------------------------- shell -------------------------------- */
/* Shareable links land you exactly where they point: ?item=A-64 opens that one
   piece of content, ?stop=volunteer opens the top of that stop. */
function startIndex() {
  try {
    const q = new URLSearchParams(location.search);
    const item = q.get('item');
    if (item) {
      const i = ITEMS.findIndex((e) => e.item.id === item);
      if (i >= 0) return i;
    }
    const stop = q.get('stop');
    if (stop) {
      const i = ITEMS.findIndex((e) => e.stage.key === stop);
      if (i >= 0) return i;
    }
    return 0;
  } catch (e) { return 0; }
}

function App() {
  const [idx, setIdx] = useState(startIndex);
  const [log, setLog] = useState(() => { try { return JSON.parse(localStorage.getItem(STORE_LS)||'{}'); } catch(e){ return {}; } });
  useEffect(() => { localStorage.setItem(STORE_LS, JSON.stringify(log)); }, [log]);

  const atDone = idx >= ITEMS.length;
  const cur = atDone ? null : ITEMS[idx];
  const record = (id, val) => setLog((l) => ({ ...l, [id]: val }));
  const next = () => setIdx((i) => Math.min(i + 1, ITEMS.length));
  const back = () => setIdx((i) => Math.max(i - 1, 0));
  const exit = () => { window.location.href = 'prospect-home.html'; };

  const stage = cur ? cur.stage : ITEMS[ITEMS.length - 1].stage;
  const no = cur ? cur.no : STAGES.length;
  const stageItems = ITEMS.map((e, gi) => ({ ...e, gi })).filter((e) => e.stage.key === stage.key);
  const openActions = stage.items.filter((it) => it.type === 'action' && log[it.id] !== 'done').length;
  const progress = Math.min(idx, ITEMS.length) / ITEMS.length;

  let content;
  if (atDone) content = <DoneScreen log={log} onExit={exit} onRestart={() => { setIdx(0); setLog({}); }} />;
  else {
    const it = cur.item; const common = { item: it, value: log[it.id], onRecord: (v) => record(it.id, v) };
    content = it.type === 'free'   ? <FreeScreen {...common} />
            : it.type === 'choice' ? <ChoiceScreen {...common} />
            : it.type === 'yesno'  ? <YesNoScreen {...common} />
            : it.type === 'course' ? <CourseScreen {...common} />
            : <ActionScreen {...common} />;
  }

  return (
    <div className="fixed inset-0 flex flex-col bg-porcelain text-mineshaft"
         style={{ backgroundImage: 'radial-gradient(circle at 1px 1px, rgba(58,95,173,0.055) 1px, transparent 0)', backgroundSize: '22px 22px' }}>
      {/* top bar */}
      <header className="flex items-center justify-between border-b border-mercury bg-white px-5 py-4 sm:px-7">
        <button onClick={exit} className="inline-flex items-center gap-2 text-[15px] font-extrabold text-boulder transition hover:text-mineshaft">{I.arrowLeft} Back to {PATHWAY}</button>
        <button onClick={exit} aria-label="Close" className="text-silver transition hover:text-mineshaft">{I.x}</button>
      </header>

      {/* progress */}
      <div className="h-1.5 w-full bg-periwinkle">
        <div className="h-full bg-[linear-gradient(to_right,#3A5FAD,#5873FA)] transition-[width] duration-500" style={{ width:`${progress*100}%` }} />
      </div>

      {/* stage header */}
      <div className="border-b border-mercury bg-white px-5 py-4 sm:px-7">
        {/* the subsection you are in, front and centre */}
        <h1 className="text-[30px] font-black leading-tight text-mineshaft sm:text-[38px]">
          {atDone ? SECTION : stage.name}
        </h1>
        {!atDone && (
          <div className="mt-1.5 flex flex-wrap items-center gap-x-3 gap-y-2">
            <span className="text-[13.5px] font-extrabold text-dusty">Lesson {no} of {STAGES.length}</span>
            {openActions > 0 && (
              <span className="rounded-full bg-warning/[0.12] px-2.5 py-1 text-[12.5px] font-extrabold text-warning">{openActions} action{openActions > 1 ? 's' : ''} open</span>
            )}
          </div>
        )}
      </div>

      {/* two-pane */}
      <div className="flex min-h-0 flex-1">
        {!atDone && <Rail stage={stage} stageItems={stageItems} idx={idx} log={log} onJump={setIdx} />}
        <main className="flex min-w-0 flex-1 flex-col">
          <div className="flex-1 overflow-y-auto px-6 py-10 sm:px-12">
            <div key={idx} className="beat-in mx-auto max-w-2xl">{content}</div>
          </div>
          {!atDone && (
            <footer className="flex items-center justify-between border-t border-mercury bg-white px-6 py-4 sm:px-12">
              <button onClick={back} disabled={idx === 0}
                className={`inline-flex items-center gap-2 text-[14px] font-extrabold transition ${idx === 0 ? 'invisible' : 'text-dusty hover:text-boulder'}`}>{I.arrowLeft} Back</button>
              <button onClick={next}
                className="inline-flex items-center gap-2 rounded-full bg-[linear-gradient(to_right,#3A5FAD,#5873FA)] px-6 py-2.5 text-[14px] font-extrabold text-white transition hover:brightness-95">
                Next {I.arrowRight}
              </button>
            </footer>
          )}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<div id="cp-demo" role="dialog" aria-modal="true" aria-labelledby="cp-demo-title">
  <div class="cpd-card">
    <div class="cpd-t" id="cp-demo-title">Just a demo</div>
    <p class="cpd-b"></p>
    <button class="cpd-x" type="button">Got it</button>
  </div>
</div>
<script>(function(){
  var DEFAULT = 'This part of the prototype is not built yet.';
  var el = document.getElementById('cp-demo');
  var body = el.querySelector('.cpd-b');
  function show(msg){ body.textContent = msg || DEFAULT; el.classList.add('is-on'); }
  function hide(){ el.classList.remove('is-on'); }
  el.addEventListener('click', function(e){ if (e.target === el) hide(); });
  el.querySelector('.cpd-x').addEventListener('click', hide);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') hide(); });

  // Any anchor that goes nowhere (href="#", empty, or opted in with data-demo)
  // is a dead end in the prototype: say so instead of doing nothing.
  document.addEventListener('click', function(e){
    if (e.defaultPrevented) return;
    var a = e.target.closest && e.target.closest('a,[data-demo]');
    if (!a) return;
    if (a.closest('#cp-proto-nav') || a.closest('#cp-demo')) return;  // internal nav + this dialog
    var href = a.getAttribute('href');
    var dead = a.hasAttribute('data-demo') || !href || href === '' || href.charAt(0) === '#'
               || href.indexOf('javascript:') === 0;
    if (!dead) return;
    e.preventDefault();
    show(a.getAttribute('data-demo'));
  });
})();</script>
